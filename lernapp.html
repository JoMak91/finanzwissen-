<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanz-Akademie</title>
<meta name="theme-color" content="#123c69">

<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#15202b; --muted:#5b6675; --line:#dde3ea;
  --brand:#123c69; --brand2:#1f6f8b; --accent:#e0a526; --ok:#1e8a4c; --bad:#c0392b;
  --soft:#e8eef6; --shadow:0 1px 3px rgba(16,32,64,.08),0 4px 14px rgba(16,32,64,.06);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f141b; --card:#18202b; --ink:#e7edf4; --muted:#9aa7b6; --line:#2a3542;
    --brand:#5b9bd5; --brand2:#4fb3c9; --soft:#1f2a37; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
main{padding:14px 16px 100px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:11.5px}
nav a span{display:block;font-size:21px;line-height:1.2}
nav a.on{color:var(--brand);font-weight:700}
h2{font-size:21px;margin:6px 0 10px}
h3{font-size:17px;margin:18px 0 8px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.tile .ic{font-size:28px}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--muted);font-size:12px}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.tile.hl{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
.tile.hl small{color:rgba(255,255,255,.85)}
.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
.tile.hl .bar{background:rgba(255,255,255,.25)}
.tile.hl .bar i{background:var(--accent)}
.list a{display:flex;align-items:center;gap:10px;padding:13px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list a:last-child{border-bottom:0}
.list .chk{min-width:30px;height:30px;font-size:11px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.list .chk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.list .arr{margin-left:auto;color:var(--muted)}
.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;text-decoration:none;text-align:center;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.block{display:block;width:100%;margin:8px 0}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.lesson{font-size:16.5px}
.lesson ul,.lesson ol{padding-left:20px;margin:8px 0}
.lesson li{margin:5px 0}
.box{background:var(--soft);border-left:4px solid var(--brand2);border-radius:8px;padding:10px 12px;margin:12px 0}
.box.warn{border-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:15.5px;color:var(--ink);cursor:pointer}
.opt.pick{border-color:var(--brand);background:var(--soft);font-weight:600}
.opt.ok{border-color:var(--ok);background:rgba(30,138,76,.12)}
.opt.bad{border-color:var(--bad);background:rgba(192,57,43,.1)}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13.5px}
label.f{display:block;margin:10px 0 3px;font-size:14px;color:var(--muted)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink)}
input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.res div{background:var(--soft);border-radius:10px;padding:10px}
.res div b{display:block;font-size:19px}
.res div small{color:var(--muted);font-size:12.5px}
.res .big{grid-column:1/-1;background:var(--brand);color:#fff}
.res .big small{color:rgba(255,255,255,.85)}
.chip{display:inline-block;padding:6px 11px;border-radius:20px;background:var(--soft);margin:3px 4px 3px 0;font-size:13.5px;border:0;color:var(--ink)}
.chip.on{background:var(--brand);color:#fff}
.lnk{display:block;padding:12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lnk:last-child{border-bottom:0}
.lnk b{color:var(--brand);display:block}
.lnk small{color:var(--muted)}
.flip{perspective:1000px;height:230px;margin:14px 0;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.flip .fa{background:var(--brand);color:#fff;font-size:22px;font-weight:700}
.flip .fb{background:var(--card);transform:rotateY(180deg);font-size:16px}
.gl dt{font-weight:700;margin-top:12px}
.gl dd{margin:2px 0 0;color:var(--ink)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin:22px 0 4px}
.ring{display:flex;align-items:center;gap:14px}
svg text{font-family:inherit}
</style>

const TOPICS = [
{id:"grundlagen", ic:"🧭", title:"Finanz-Grundlagen", sub:"Budget, Notgroschen, Zinseszins",
lessons:[
{t:"Die richtige Reihenfolge", b:`<p>Eine gute Finanzplanung geht in einer festen Reihenfolge vor. Wer sie einhält, baut auf einem stabilen Fundament.</p>
<ol><li><b>Existenzbedrohende Risiken absichern</b>: Privathaftpflicht, Berufsunfähigkeit, bei Familie oder Kredit eine Risikolebensversicherung.</li>
<li><b>Notgroschen</b> aufbauen: 3 bis 6 Netto-Monatsgehälter auf dem Tagesgeldkonto.</li>
<li><b>Teure Schulden</b> tilgen, zum Beispiel Dispo- oder Ratenkredite.</li>
<li><b>Altersvorsorge und Vermögensaufbau</b>: Förderungen mitnehmen, langfristig investieren.</li>
<li><b>Ziele und Wünsche</b>: Auto, Urlaub, Immobilie mit eigenen Sparzielen planen.</li></ol>
<div class="box">Merksatz: Erst das Große absichern, dann das Kleine. Ein Haftpflichtschaden kann ein Leben lang Schulden bedeuten, ein kaputtes Handy nicht.</div>`},
{t:"Haushaltsbudget und 50-30-20-Regel", b:`<p>Wer weiß, wohin sein Geld fließt, kann gezielt sparen. Eine einfache Faustregel für das Nettoeinkommen:</p>
<ul><li><b>50 %</b> für Fixkosten (Miete/Kredit, Energie, Versicherungen, Lebensmittel)</li>
<li><b>30 %</b> für Freizeit und Wünsche</li>
<li><b>20 %</b> für Sparen und Vorsorge</li></ul>
<p><b>„Pay yourself first“</b>: Die Sparrate per Dauerauftrag direkt nach dem Gehaltseingang abbuchen lassen, nicht erst am Monatsende das sparen, was übrig bleibt.</p>
<div class="box">Tipp aus der Beratung: Einmal drei Monate alle Ausgaben aufschreiben. Die meisten entdecken dabei 100 € und mehr im Monat, die unbemerkt verschwinden.</div>`},
{t:"Der Notgroschen", b:`<p>Der Notgroschen ist die Reserve für Unvorhergesehenes: Waschmaschine kaputt, Autoreparatur, Jobwechsel.</p>
<ul><li>Höhe: <b>3 bis 6 Netto-Monatsgehälter</b>, bei Familie, Eigenheim oder Selbstständigkeit eher mehr.</li>
<li>Ort: <b>Tagesgeld</b>, täglich verfügbar und über die Einlagensicherung bis 100.000 € pro Bank und Person geschützt.</li>
<li>Nicht ins Aktiendepot: Im Crash müsste man sonst mit Verlust verkaufen.</li></ul>
<p>Erst wenn der Notgroschen steht, lohnt sich das langfristige Investieren richtig.</p>`},
{t:"Inflation – der stille Gegner", b:`<p>Inflation bedeutet: Das Geld verliert an Kaufkraft. Bei 2 % Inflation pro Jahr sind 1.000 € nach 35 Jahren nur noch etwa die Hälfte wert.</p>
<p><b>Realzins = Nominalzins – Inflation.</b> Bringt das Sparbuch 1 % und die Inflation liegt bei 2,5 %, verliert man real 1,5 % pro Jahr.</p>
<div class="box">Deshalb reicht reines Sparen für die Altersvorsorge nicht aus. Langfristig braucht es Sachwerte wie Aktien oder Immobilien, die mit der Inflation mitwachsen können.</div>`},
{t:"Zinseszins und 72er-Regel", b:`<p>Beim Zinseszins werden auch die Erträge wieder verzinst. Je länger die Laufzeit, desto stärker der Effekt.</p>
<p><b>Beispiel:</b> 100 € im Monat, 30 Jahre, 6 % Rendite pro Jahr: Eingezahlt werden 36.000 €, am Ende stehen knapp <b>100.000 €</b> im Depot.</p>
<p><b>72er-Regel:</b> 72 geteilt durch den Zinssatz ergibt ungefähr die Jahre bis zur Verdopplung. Bei 6 % sind das 12 Jahre, bei 8 % neun Jahre.</p>
<div class="box">Der wichtigste Faktor ist die Zeit. Wer 10 Jahre früher anfängt, braucht für dasselbe Ziel oft nur die Hälfte der Sparrate.</div>`}
],
quiz:[
{q:"Wie hoch sollte ein Notgroschen typischerweise sein?",a:["1 Netto-Monatsgehalt","3 bis 6 Netto-Monatsgehälter","2 Brutto-Jahresgehälter","So viel wie möglich im Aktiendepot"],c:1,e:"Üblich sind 3 bis 6 Netto-Monatsgehälter, gut erreichbar auf dem Tagesgeldkonto."},
{q:"Was steht in der Finanzplanung an erster Stelle?",a:["ETF-Sparplan","Existenzbedrohende Risiken absichern","Urlaubskasse","Bausparvertrag"],c:1,e:"Zuerst werden Risiken abgesichert, die die Existenz bedrohen (z. B. Haftpflicht, Berufsunfähigkeit)."},
{q:"Nach der 72er-Regel: Wie lange dauert die Verdopplung bei 6 % Rendite?",a:["6 Jahre","9 Jahre","12 Jahre","18 Jahre"],c:2,e:"72 ÷ 6 = 12 Jahre."},
{q:"Zins 2 %, Inflation 3 %. Wie hoch ist der Realzins?",a:["+5 %","+1 %","-1 %","0 %"],c:2,e:"Realzins = Nominalzins – Inflation = 2 % – 3 % = –1 %."},
{q:"Wie viel Prozent sieht die 50-30-20-Regel fürs Sparen vor?",a:["10 %","20 %","30 %","50 %"],c:1,e:"20 % des Nettoeinkommens gehen in Sparen und Vorsorge."},
{q:"Wo sollte der Notgroschen am besten liegen?",a:["Aktien-ETF","Tagesgeldkonto","Bausparvertrag","Lebensversicherung"],c:1,e:"Tagesgeld ist täglich verfügbar und schwankt nicht."},
{q:"Was bedeutet „Pay yourself first“?",a:["Zuerst Schulden zahlen","Sparrate direkt nach Gehaltseingang abbuchen","Erst Konsum, dann sparen","Sich selbst ein Gehalt auszahlen"],c:1,e:"Die Sparrate geht als Dauerauftrag direkt am Monatsanfang weg."}
]},

{id:"altersvorsorge", ic:"🏖️", title:"Altersvorsorge", sub:"Rentenlücke, 3 Schichten, bAV",
lessons:[
{t:"Die Rentenlücke", b:`<p>Die gesetzliche Rente deckt nur einen Teil des letzten Einkommens. Das Rentenniveau liegt derzeit bei 48 % – das ist das Verhältnis einer Standardrente nach 45 Beitragsjahren zum Durchschnittsverdienst, <b>vor Steuern und Sozialabgaben</b>.</p>
<p>Im Alter fallen außerdem Steuern sowie Kranken- und Pflegeversicherungsbeiträge an.</p>
<p><b>Rentenlücke = gewünschtes Alterseinkommen – erwartete Renten</b></p>
<p>Als Faustregel braucht man im Alter etwa <b>70–80 % des letzten Nettoeinkommens</b>, um den Lebensstandard zu halten.</p>
<div class="box">Die jährliche <b>Renteninformation</b> der Deutschen Rentenversicherung (ab 27 Jahren) ist die Basis jeder Rentenlückenrechnung. Im Rechner-Bereich der App gibt es einen Schnellcheck.</div>`},
{t:"Das 3-Schichten-Modell", b:`<p>Die Altersvorsorge in Deutschland wird in drei Schichten eingeteilt – nach der Art der steuerlichen Förderung.</p>
<table class="t"><tr><th>Schicht</th><th>Beispiele</th></tr>
<tr><td><b>1 – Basisversorgung</b></td><td>Gesetzliche Rente, berufsständische Versorgungswerke, Basisrente (Rürup)</td></tr>
<tr><td><b>2 – Zusatzversorgung</b></td><td>Betriebliche Altersvorsorge (bAV), Riester, ab 2027 das Altersvorsorgedepot</td></tr>
<tr><td><b>3 – Private Vorsorge</b></td><td>Private Renten- und Lebensversicherung, ETF-Depot, Immobilien</td></tr></table>
<p>Schicht 1 und 2 werden stark gefördert, dafür ist das Geld bis zur Rente gebunden. Schicht 3 ist flexibel, aber ohne direkte Zulagen.</p>`},
{t:"Die gesetzliche Rente", b:`<ul><li><b>Umlageverfahren</b>: Die heutigen Beitragszahler finanzieren die heutigen Renten (Generationenvertrag).</li>
<li>Beiträge: ein fester Prozentsatz des Bruttolohns, je zur Hälfte von Arbeitgeber und Arbeitnehmer.</li>
<li>Für jedes Jahr mit Durchschnittsverdienst gibt es einen <b>Entgeltpunkt</b>.</li>
<li><b>Regelaltersgrenze 67</b> für alle ab Jahrgang 1964.</li>
<li>Vorzeitige Rente: <b>0,3 % Abschlag pro Monat</b>, also 3,6 % pro Jahr – lebenslang.</li></ul>
<div class="box warn">Der demografische Wandel (mehr Rentner, weniger Beitragszahler) setzt das System unter Druck. Private und betriebliche Vorsorge werden deshalb wichtiger.</div>`},
{t:"Betriebliche Altersvorsorge (bAV)", b:`<p>Bei der bAV wird ein Teil des Bruttogehalts in eine Betriebsrente umgewandelt (<b>Entgeltumwandlung</b>).</p>
<ul><li>5 Durchführungswege: Direktversicherung, Pensionskasse, Pensionsfonds, Unterstützungskasse, Direktzusage.</li>
<li>Beiträge sind bis <b>8 % der Beitragsbemessungsgrenze</b> (Rentenversicherung) steuerfrei und bis <b>4 %</b> sozialversicherungsfrei.</li>
<li>Der Arbeitgeber muss bei Entgeltumwandlung <b>15 % Zuschuss</b> zahlen, soweit er Sozialabgaben spart. Viele zahlen freiwillig mehr.</li>
<li>Im Alter: Die Betriebsrente ist voll steuerpflichtig, dazu kommen Kranken- und Pflegeversicherungsbeiträge (mit Freibetrag in der KV).</li></ul>
<div class="box">Beratungsfrage: „Was gibt Ihr Arbeitgeber dazu?“ – Ein hoher Arbeitgeberzuschuss macht die bAV oft sehr attraktiv.</div>`},
{t:"Basisrente (Rürup)", b:`<ul><li>Gehört zur <b>Schicht 1</b>, wie die gesetzliche Rente.</li>
<li>Beiträge sind bis zum jährlichen Höchstbetrag zu <b>100 % als Sonderausgaben</b> absetzbar.</li>
<li>Auszahlung nur als <b>lebenslange Rente</b>, frühestens ab 62. Nicht kapitalisierbar, nicht beleihbar, nicht vererbbar (außer Hinterbliebenenschutz für Ehepartner/Kinder).</li>
<li>Die Rente ist im Alter voll steuerpflichtig.</li></ul>
<p>Besonders interessant für <b>Selbstständige</b> und Gutverdiener mit hohem Steuersatz.</p>`},
{t:"Private Rentenversicherung", b:`<ul><li><b>Klassisch</b> mit Garantiezins oder <b>fondsgebunden</b> mit höheren Renditechancen.</li>
<li>Bei <b>Kapitalauszahlung</b>: Nur der halbe Ertrag wird versteuert, wenn der Vertrag mindestens <b>12 Jahre</b> lief und die Auszahlung <b>ab 62</b> erfolgt (Halbeinkünfteverfahren).</li>
<li>Bei <b>Rentenzahlung</b>: Nur der Ertragsanteil wird versteuert, z. B. 17 % bei Rentenbeginn mit 67.</li>
<li>Vorteile: lebenslange Rente (Langlebigkeitsrisiko), steuerfreies Umschichten innerhalb des Vertrags, oft Zusatzbausteine.</li></ul>`},
{t:"Riester – Auslaufmodell mit Bestandsschutz", b:`<ul><li>Neue Riester-Verträge gibt es nur noch bis Ende 2026. Ab 2027 folgt das <b>Altersvorsorgedepot</b>.</li>
<li>Bestehende Verträge laufen mit <b>Bestandsschutz</b> weiter.</li>
<li>Man kann per Erklärung in die neue Fördersystematik wechseln oder das Kapital übertragen. Dabei können Kosten entstehen, und ein Rückweg ins alte Recht ist ausgeschlossen.</li>
<li><b>Nicht einfach kündigen</b>: Eine Kündigung ist eine „schädliche Verwendung“ – die Zulagen und Steuervorteile müssen zurückgezahlt werden.</li></ul>`}
],
quiz:[
{q:"Zu welcher Schicht gehört die betriebliche Altersvorsorge?",a:["Schicht 1","Schicht 2","Schicht 3","Zu keiner"],c:1,e:"bAV, Riester und das neue Altersvorsorgedepot gehören zur Schicht 2."},
{q:"Zu welcher Schicht gehört die Basisrente (Rürup)?",a:["Schicht 1","Schicht 2","Schicht 3","Zu keiner"],c:0,e:"Die Basisrente ist Teil der Basisversorgung, wie die gesetzliche Rente."},
{q:"Was bedeutet „Umlageverfahren“ bei der gesetzlichen Rente?",a:["Jeder spart für sich selbst an","Die Beiträge von heute zahlen die Renten von heute","Der Staat legt alles in Aktien an","Arbeitgeber zahlen allein"],c:1,e:"Das ist der Generationenvertrag: Die aktuellen Beiträge finanzieren direkt die aktuellen Renten."},
{q:"Wie hoch ist der Abschlag pro Monat bei vorzeitiger Altersrente?",a:["0,1 %","0,3 %","0,5 %","1 %"],c:1,e:"0,3 % pro Monat, also 3,6 % pro Jahr – lebenslang."},
{q:"Welchen Pflichtzuschuss muss der Arbeitgeber bei Entgeltumwandlung zahlen?",a:["Keinen","10 %","15 %","50 %"],c:2,e:"15 %, soweit er Sozialversicherungsbeiträge einspart."},
{q:"Wann gilt das Halbeinkünfteverfahren bei einer privaten Rentenversicherung?",a:["Immer","Laufzeit 12 Jahre und Auszahlung ab 62","Laufzeit 5 Jahre","Nur bei Rentenzahlung"],c:1,e:"Mindestens 12 Jahre Laufzeit und Auszahlung ab 62 – dann wird nur der halbe Ertrag versteuert."},
{q:"Was passiert bei einer Kündigung eines Riester-Vertrags?",a:["Nichts","Zulagen und Steuervorteile müssen zurückgezahlt werden","Man bekommt einen Bonus","Der Vertrag wird automatisch ein Altersvorsorgedepot"],c:1,e:"Eine Kündigung ist schädliche Verwendung. Besser: beitragsfrei stellen, wechseln oder übertragen."},
{q:"Welcher Anteil des letzten Nettos wird als Faustregel im Alter benötigt?",a:["30–40 %","50 %","70–80 %","120 %"],c:2,e:"Etwa 70–80 % des letzten Nettoeinkommens, um den Lebensstandard zu halten."}
]},

{id:"avd", ic:"🆕", title:"Altersvorsorgedepot 2027", sub:"Neue Förderung ab 1. Januar 2027", hl:true,
lessons:[
{t:"Was ist das Altersvorsorgedepot?", b:`<p>Das Altersvorsorgedepot ist der <b>Nachfolger der Riester-Rente</b>. Das Altersvorsorgereformgesetz wurde im Mai 2026 verkündet. Die Produkte starten am <b>1. Januar 2027</b>.</p>
<ul><li>Ein zertifizierter Altersvorsorgevertrag, in dem in <b>Fonds und ETFs</b> gespart wird.</li>
<li><b>Keine Pflicht zur Beitragsgarantie</b> mehr – eine Aktienquote von bis zu 100 % ist möglich.</li>
<li>Erstmals sind auch <b>alle Selbstständigen</b> förderberechtigt.</li>
<li>Vor 2027 gibt es nur Vormerklisten. Verträge dürfen erst nach der Zertifizierung verkauft werden.</li></ul>
<div class="box">Stand dieser Lektion: Oktober 2026. Konkrete Kosten und Fondslisten der Anbieter lassen sich erst ab dem Marktstart vergleichen.</div>`},
{t:"Die Grundzulage – bis 540 € pro Jahr", b:`<p>Die Zulage richtet sich nach dem eigenen Beitrag (beitragsproportional). Der einkommensabhängige Mindesteigenbeitrag aus der Riester-Welt entfällt.</p>
<table class="t"><tr><th>Eigenbeitrag pro Jahr</th><th class="r">Zulage</th></tr>
<tr><td>erste 360 € (30 €/Monat)</td><td class="r"><b>50 %</b> = max. 180 €</td></tr>
<tr><td>360 € bis 1.800 €</td><td class="r"><b>25 %</b> = max. 360 €</td></tr>
<tr><td><b>Maximum bei 1.800 € (150 €/Monat)</b></td><td class="r"><b>540 €</b></td></tr></table>
<ul><li>Voraussetzung: mindestens <b>120 € Eigenbeitrag pro Jahr</b> (10 €/Monat).</li>
<li>Einzahlen darf man bis <b>6.840 € pro Jahr</b>, gefördert werden davon 1.800 €.</li></ul>
<div class="box">Beispiel: 100 €/Monat = 1.200 € im Jahr → 180 € + 25 % von 840 € (210 €) = <b>390 € Zulage</b>.</div>`},
{t:"Kinderzulage und Berufseinsteigerbonus", b:`<ul><li><b>Kinderzulage</b>: 1 € Zulage je eingezahltem Euro, höchstens <b>300 € pro Kind und Jahr</b>.</li>
<li>Die volle Kinderzulage gibt es für <b>jedes</b> Kind schon ab <b>300 € Eigenbeitrag im Jahr</b> (25 €/Monat).</li>
<li>Sie fließt in das Depot des zulageberechtigten Elternteils, nicht in ein Depot des Kindes.</li>
<li><b>Berufseinsteigerbonus</b>: einmalig <b>200 €</b> bei Vertragsabschluss vor dem 25. Geburtstag.</li></ul>
<div class="box">Beispiel Familie mit 2 Kindern: 300 € Eigenbeitrag → 150 € Grundzulage + 600 € Kinderzulage = <b>750 € Förderung</b>. Aus 300 € werden 1.050 € im Depot.</div>`},
{t:"Die Produktarten", b:`<ul><li><b>Standarddepot</b>: Jeder Anbieter muss es führen. Zwei vorgegebene Fonds (defensiv und chancenorientiert), vor Rentenbeginn wird schrittweise umgeschichtet. <b>Effektivkosten max. 1,0 % pro Jahr.</b></li>
<li><b>Frei gestaltetes Depot</b>: eigene Fondsauswahl nach einer Positivliste (u. a. höchstens Risikoklasse 5 im Basisinformationsblatt). Breite Welt-ETFs sind zulässig, Krypto und Hebelprodukte nicht. Hier gibt es keinen Kostendeckel.</li>
<li><b>Garantieprodukte</b>: optional mit 80 % oder 100 % Beitragsgarantie für Sicherheitsorientierte.</li></ul>
<div class="box warn">Kosten zählen: 1 % Effektivkosten klingen wenig, kosten über 30 Jahre aber etwa ein Viertel des Endvermögens.</div>`},
{t:"Auszahlung im Alter", b:`<ul><li>Auszahlbeginn frühestens mit <b>65</b>, spätestens mit <b>70</b> Jahren.</li>
<li>Früher nur, wenn bereits eine gesetzliche Altersrente bezogen wird.</li>
<li>Wahl zwischen <b>lebenslanger Rente</b> oder einem <b>Auszahlplan mindestens bis 85</b>.</li></ul>
<div class="box warn">Häufiger Irrtum: „Das Geld ist ab 62 verfügbar.“ Das stimmt nicht – die Zahl 62 stammt aus dem Steuerrecht für ungeförderte Beiträge.</div>`},
{t:"Steuern", b:`<ul><li><b>Ansparphase steuerfrei</b>: keine Vorabpauschale, keine Abgeltungsteuer beim Umschichten.</li>
<li><b>Nachgelagerte Besteuerung</b>: Auszahlungen aus geförderten Beiträgen werden im Alter mit dem persönlichen Steuersatz versteuert – inklusive Zulagen und Erträgen.</li>
<li>Das Finanzamt prüft automatisch, ob der <b>Sonderausgabenabzug</b> mehr bringt als die Zulage (Günstigerprüfung).</li></ul>`},
{t:"Wichtige Spielregeln", b:`<ul><li>Gefördert werden höchstens <b>2 Verträge</b> nach neuem Recht. Maßgeblich ist das Abschlussdatum.</li>
<li><b>Anbieterwechsel</b> nach 5 Jahren kostenfrei, der neue Anbieter darf höchstens 150 € berechnen.</li>
<li>Riester-Verträge behalten Bestandsschutz. Wechsel in die neue Förderung per Erklärung oder Übertragung möglich, kein Rückweg.</li>
<li>Zwischenzeitliche Verluste von 30–40 % sind bei Aktien normal und werden nicht ausgeglichen. Was das Risiko begrenzt, ist die lange Laufzeit.</li></ul>`},
{t:"Frühstartrente (geplant)", b:`<p>Die Frühstartrente ist eine eigene Förderung für Kinder und fließt in dieselbe Produktwelt.</p>
<ul><li>Der Bund zahlt <b>10 € pro Monat</b> vom 6. bis zum 18. Lebensjahr, über 12 Jahre also 1.440 €.</li>
<li>Geplanter Start: 1. Januar 2027 mit den Jahrgängen 2020 und 2021.</li>
<li>Gefördert wird ein Standarddepot mit 1 % Kostendeckel. Ohne Depot legt der Bund das Geld kollektiv an (verwaltet von der Bundesbank).</li>
<li>Das Geld ist erst ab 65 verfügbar – also nichts für Führerschein oder Studium.</li></ul>
<div class="box warn">Stand Oktober 2026: Das Kabinett hat den Entwurf am 12. August 2026 beschlossen, Bundestag und Bundesrat haben noch nicht entschieden.</div>`}
],
quiz:[
{q:"Wie hoch ist die maximale Grundzulage pro Jahr?",a:["175 €","300 €","540 €","1.800 €"],c:2,e:"180 € (50 % auf 360 €) + 360 € (25 % auf 1.440 €) = 540 €."},
{q:"Welcher Eigenbeitrag ist für die volle Grundzulage nötig?",a:["360 € im Jahr","1.200 € im Jahr","1.800 € im Jahr","6.840 € im Jahr"],c:2,e:"1.800 € pro Jahr, also 150 € pro Monat."},
{q:"Wie hoch ist der Mindesteigenbeitrag für eine Zulage?",a:["10 € im Jahr","120 € im Jahr","4 % vom Einkommen","360 € im Jahr"],c:1,e:"Mindestens 120 € pro Jahr (10 €/Monat)."},
{q:"Ab welchem Eigenbeitrag gibt es die volle Kinderzulage?",a:["120 € pro Jahr","300 € pro Jahr","300 € pro Kind und Monat","1.800 € pro Jahr"],c:1,e:"300 € pro Jahr (25 €/Monat) reichen für die volle Kinderzulage jedes Kindes."},
{q:"2 Kinder, 300 € Eigenbeitrag im Jahr. Wie hoch ist die Förderung insgesamt?",a:["300 €","450 €","750 €","1.140 €"],c:2,e:"150 € Grundzulage + 2 × 300 € Kinderzulage = 750 €."},

]},

{id:"vermoegen", ic:"📈", title:"Vermögensaufbau", sub:"ETF, Fonds, Kosten, Steuern",
lessons:[
{t:"Das magische Dreieck", b:`<p>Jede Geldanlage wird nach drei Zielen beurteilt:</p>
<ul><li><b>Rendite</b> – wie viel Ertrag bringt sie?</li><li><b>Sicherheit</b> – wie stark schwankt sie, droht Verlust?</li><li><b>Liquidität</b> – wie schnell komme ich an mein Geld?</li></ul>
<p>Keine Anlage erfüllt alle drei Ziele gleichzeitig. Tagesgeld ist sicher und liquide, bringt aber wenig. Aktien bringen langfristig mehr, schwanken aber stark.</p>
<div class="box">Die richtige Mischung hängt vom Anlageziel, vom Zeithorizont und von der Risikobereitschaft ab.</div>`},
{t:"Anlageklassen und Risikoklassen", b:`<ul><li><b>Tages- und Festgeld</b>: sicher, wenig Rendite.</li>
<li><b>Anleihen</b>: Kredit an Staaten oder Unternehmen, fester Zins.</li>
<li><b>Aktien</b>: Beteiligung an Unternehmen, höchste Renditechance, starke Schwankungen.</li>
<li><b>Fonds</b>: Bündeln viele Wertpapiere.</li>
<li><b>Immobilien</b>, <b>Rohstoffe und Gold</b> als Sachwerte.</li></ul>
<p>Im <b>Basisinformationsblatt</b> steht der Gesamtrisikoindikator <b>SRI von 1 (gering) bis 7 (hoch)</b>.</p>`},
{t:"Fonds und ETFs", b:`<ul><li><b>Aktiver Fonds</b>: Ein Fondsmanager wählt Wertpapiere aus und will den Markt schlagen. Höhere Kosten.</li>
<li><b>ETF</b> (Exchange Traded Fund): bildet einen Index passiv nach, z. B. den MSCI World mit über 1.000 Unternehmen aus 23 Industrieländern. Sehr günstig.</li>
<li><b>Sondervermögen</b>: Fondsgeld ist bei einer Pleite der Fondsgesellschaft geschützt.</li>
<li><b>Ausschüttend</b> (Erträge werden ausgezahlt) oder <b>thesaurierend</b> (Erträge werden wieder angelegt).</li></ul>
<div class="box">Der MSCI World enthält nur Industrieländer. Der MSCI ACWI oder die Kombination World + Emerging Markets streut zusätzlich in Schwellenländer.</div>`},
{t:"Kosten verstehen", b:`<ul><li><b>Laufende Kosten (TER)</b>: jährlich im Fonds, bei ETFs oft 0,1–0,3 %.</li>
<li><b>Ausgabeaufschlag</b>: einmalig beim Kauf, bei aktiven Fonds oft bis 5 %.</li>
<li><b>Depot- und Ordergebühren</b> beim Broker oder der Bank.</li>
<li><b>Effektivkosten</b> (Renditeminderung): fassen alles zusammen – der beste Vergleichswert.</li></ul>
<div class="box warn">Kosten sind sicher, Renditen nicht. Schon 1 % mehr Kosten pro Jahr können über 30 Jahre etwa ein Viertel des Endvermögens kosten.</div>`},
{t:"Sparplan und Cost-Average-Effekt", b:`<p>Beim Sparplan wird jeden Monat ein fester Betrag investiert.</p>
<ul><li>Bei niedrigen Kursen kauft man <b>mehr</b> Anteile, bei hohen Kursen <b>weniger</b>. Das ist der <b>Durchschnittskosteneffekt</b>.</li>
<li>Man muss nicht den „richtigen Zeitpunkt“ finden.</li>
<li>Mit einer <b>Dynamik</b> (z. B. +3 % pro Jahr) wächst die Sparrate mit dem Gehalt.</li></ul>`},
{t:"Streuung und Anlagehorizont", b:`<ul><li><b>Diversifikation</b>: über Länder, Branchen und Anlageklassen streuen. Ein Einzelwert kann ausfallen, der Weltmarkt als Ganzes hat sich langfristig immer erholt.</li>
<li><b>Klumpenrisiko</b> vermeiden, z. B. nur Aktien des eigenen Arbeitgebers.</li>
<li><b>Anlagehorizont</b>: Aktien eignen sich für Geld, das 10–15 Jahre und länger nicht gebraucht wird.</li>
<li><b>Rebalancing</b>: die Aufteilung regelmäßig auf die Zielgewichtung zurückführen.</li></ul>
<div class="box">Crashs von 30–40 % gehören dazu. Wer dann in Panik verkauft, macht Buchverluste zu echten Verlusten.</div>`},
{t:"Steuern auf Kapitalerträge", b:`<ul><li><b>Abgeltungsteuer 25 %</b> plus 5,5 % Solidaritätszuschlag darauf (zusammen 26,375 %), ggf. Kirchensteuer.</li>
<li><b>Sparerpauschbetrag</b>: 1.000 € pro Person, 2.000 € für Ehepaare pro Jahr steuerfrei.</li>
<li>Dafür bei der Bank einen <b>Freistellungsauftrag</b> erteilen.</li>
<li><b>Teilfreistellung</b>: Bei Aktienfonds und -ETFs bleiben 30 % der Erträge steuerfrei.</li>
<li><b>Vorabpauschale</b>: Bei thesaurierenden Fonds wird jährlich ein fiktiver Mindestertrag besteuert.</li></ul>`},
{t:"Sparen für Kinder", b:`<ul><li><b>Depot auf den Namen des Kindes</b>: Das Kind hat eigenen Grundfreibetrag und Sparerpauschbetrag. Aber: Das Geld gehört dem Kind und ist ab 18 frei verfügbar. Es kann bei BAföG angerechnet werden.</li>
<li><b>Depot der Eltern</b> mit „Kinder-Unterkonto“: Eltern behalten die Kontrolle.</li>
<li>Ab 2027 gibt es zusätzlich die <b>Kinderzulage</b> im eigenen Altersvorsorgedepot und geplant die <b>Frühstartrente</b>.</li></ul>`}
],
quiz:[
{q:"Welche drei Ziele bilden das magische Dreieck?",a:["Rendite, Sicherheit, Liquidität","Zins, Steuer, Kosten","Aktie, Anleihe, Fonds","Inflation, Deflation, Rezession"],c:0,e:"Rendite, Sicherheit und Liquidität – alle drei gleichzeitig sind nicht erreichbar."},
{q:"Was macht ein ETF?",a:["Ein Manager wählt Aktien aus","Er bildet einen Index passiv nach","Er garantiert eine Rendite","Er investiert nur in Gold"],c:1,e:"Ein ETF bildet einen Index nach, z. B. den MSCI World."},
{q:"Wie hoch ist der Sparerpauschbetrag für Ehepaare?",a:["801 €","1.000 €","1.602 €","2.000 €"],c:3,e:"1.000 € pro Person, 2.000 € für zusammenveranlagte Ehepaare."},
{q:"Wie viel Prozent der Erträge sind bei Aktien-ETFs teilfreigestellt?",a:["15 %","30 %","50 %","80 %"],c:1,e:"30 % der Erträge bleiben bei Aktienfonds steuerfrei."},
{q:"Was beschreibt der Cost-Average-Effekt?",a:["Bei niedrigen Kursen werden mehr Anteile gekauft","Die Kosten sinken jedes Jahr","Gebühren werden erstattet","Kurse steigen garantiert"],c:0,e:"Mit festem Betrag kauft man bei tiefen Kursen mehr Anteile."},
{q:"Was bedeutet „Sondervermögen“ bei Fonds?",a:["Das Geld ist bei Pleite der Fondsgesellschaft geschützt","Fonds für Reiche","Steuerfreies Vermögen","Ein Garantiefonds"],c:0,e:"Fondsvermögen ist rechtlich vom Vermögen der Fondsgesellschaft getrennt."},
{q:"Welche Skala hat der Risikoindikator SRI im Basisinformationsblatt?",a:["A bis F","1 bis 5","1 bis 7","0 bis 100"],c:2,e:"Der SRI reicht von 1 (geringes Risiko) bis 7 (hohes Risiko)."},
{q:"Was ist der beste Wert, um Kosten zu vergleichen?",a:["Ausgabeaufschlag","Effektivkosten","Depotgebühr","Fondsgröße"],c:1,e:"Die Effektivkosten (Renditeminderung) fassen alle Kosten zusammen."}
]},

{id:"absicherung", ic:"🛡️", title:"Vermögensabsicherung", sub:"BU, Risikoleben, Pflege, KV",
lessons:[
{t:"Die Arbeitskraft ist das größte Vermögen", b:`<p>Wer 2.500 € netto verdient und noch 30 Jahre arbeitet, hat ein Lebenseinkommen von <b>900.000 €</b> vor sich. Dieses Einkommen ist die Basis für alles andere – Miete, Kredit, Sparplan.</p>
<p>Deshalb gilt: <b>Große, existenzbedrohende Risiken zuerst absichern.</b> Kleine Schäden kann man selbst tragen.</p>
<div class="box">Etwa jeder vierte Erwerbstätige wird vor dem Rentenalter berufsunfähig. Häufigste Ursachen sind psychische Erkrankungen und Erkrankungen des Bewegungsapparats.</div>`},
{t:"Berufsunfähigkeitsversicherung (BU)", b:`<ul><li>Zahlt eine monatliche Rente, wenn man seinen <b>zuletzt ausgeübten Beruf</b> voraussichtlich mindestens 6 Monate zu mindestens <b>50 %</b> nicht mehr ausüben kann.</li>
<li>Wichtig: <b>Verzicht auf abstrakte Verweisung</b> – der Versicherer darf nicht auf einen anderen Beruf verweisen.</li>
<li><b>Nachversicherungsgarantie</b>: Rente bei Heirat, Geburt, Hauskauf ohne neue Gesundheitsprüfung erhöhen.</li>
<li>Laufzeit möglichst bis zum <b>Renteneintritt (67)</b>.</li>
<li>Höhe: etwa <b>70–80 % des Nettoeinkommens</b>.</li>
<li>Gesundheitsfragen vollständig und wahrheitsgemäß beantworten (vorvertragliche Anzeigepflicht).</li></ul>
<div class="box">Je jünger und gesünder beim Abschluss, desto günstiger der Beitrag.</div>`},
{t:"Gesetzliche Erwerbsminderungsrente", b:`<ul><li><b>Volle Erwerbsminderung</b>: Man kann <b>weniger als 3 Stunden täglich</b> irgendeine Tätigkeit ausüben.</li>
<li><b>Teilweise Erwerbsminderung</b>: 3 bis unter 6 Stunden täglich.</li>
<li>Es zählt <b>jede</b> Tätigkeit auf dem Arbeitsmarkt, nicht der eigene Beruf.</li>
<li>Wer nach 1961 geboren ist, hat <b>keinen gesetzlichen Berufsunfähigkeitsschutz</b> mehr.</li></ul>
<p>Die gesetzliche Absicherung ist deshalb meist zu niedrig, um den Lebensstandard zu halten.</p>`},
{t:"Alternativen zur BU", b:`<ul><li><b>Erwerbsunfähigkeitsversicherung</b>: zahlt erst, wenn man gar nicht mehr arbeiten kann. Günstiger, aber schwächer.</li>
<li><b>Grundfähigkeitsversicherung</b>: zahlt bei Verlust bestimmter Fähigkeiten (Sehen, Gehen, Hände gebrauchen).</li>
<li><b>Schwere-Krankheiten-Versicherung</b> (Dread Disease): Einmalzahlung bei Diagnose z. B. Krebs, Herzinfarkt, Schlaganfall.</li>
<li><b>Unfallversicherung</b>: nur bei Unfällen, Leistung nach Invaliditätsgrad (Gliedertaxe), oft mit Progression. Sie ersetzt keine BU, weil die meisten Fälle durch Krankheit entstehen.</li></ul>`},
{t:"Risikolebensversicherung", b:`<ul><li>Zahlt im Todesfall eine Summe an die Hinterbliebenen – wichtig für <b>Familien</b> und bei <b>Krediten</b>.</li>
<li>Faustregel: <b>3 bis 5 Bruttojahresgehälter</b> plus offene Kredite.</li>
<li><b>Konstante</b> Summe für die Familie, <b>fallende</b> Summe passend zur Restschuld eines Kredits.</li>
<li><b>Überkreuz-Versicherung</b> bei unverheirateten Paaren: Jeder versichert den anderen, damit keine Erbschaftsteuer anfällt.</li>
<li>Meist sehr günstig, vor allem für Nichtraucher.</li></ul>`},
{t:"Kranken- und Pflegeversicherung", b:`<ul><li><b>Gesetzliche KV</b>: Beitrag nach Einkommen, Familienversicherung für Kinder und Partner ohne eigenes Einkommen.</li>
<li><b>Private KV</b>: Beitrag nach Alter und Gesundheit, Leistungen frei wählbar. Möglich für Selbstständige, Beamte und Angestellte über der Versicherungspflichtgrenze.</li>
<li><b>Zusatzversicherungen</b>: Zahn, stationär (Einzelzimmer, Chefarzt), Auslandsreise.</li>
<li><b>Pflege</b>: Die gesetzliche Pflegeversicherung ist nur eine Teilabsicherung. Pflegegrade 1 bis 5. Der Eigenanteil im Pflegeheim liegt häufig über 2.000 € pro Monat. Lösung: <b>Pflegetagegeld</b> oder Pflegerente.</li></ul>`},
{t:"Vorsorgedokumente", b:`<ul><li><b>Testament</b>: Ohne Testament gilt die gesetzliche Erbfolge.</li>
<li><b>Vorsorgevollmacht</b>: Wer darf entscheiden, wenn ich es nicht mehr kann? Auch Ehepartner haben kein automatisches umfassendes Vertretungsrecht.</li>
<li><b>Patientenverfügung</b>: Welche medizinischen Maßnahmen will ich?</li>
<li><b>Sorgerechtsverfügung</b>: Wer kümmert sich um minderjährige Kinder?</li></ul>`}
],
quiz:[
{q:"Ab welchem Grad zahlt eine BU üblicherweise?",a:["10 %","25 %","50 %","100 %"],c:2,e:"Mindestens 50 % Berufsunfähigkeit, voraussichtlich mindestens 6 Monate."},
{q:"Was bedeutet „Verzicht auf abstrakte Verweisung“?",a:["Keine Gesundheitsfragen","Der Versicherer darf nicht auf einen anderen Beruf verweisen","Die Rente steigt jährlich","Keine Wartezeit"],c:1,e:"Ein wichtiges Qualitätsmerkmal einer BU."},
{q:"Wann gibt es die volle gesetzliche Erwerbsminderungsrente?",a:["Unter 6 Stunden im eigenen Beruf","Unter 3 Stunden in irgendeiner Tätigkeit","Ab 50 % Einschränkung","Nach jedem Unfall"],c:1,e:"Weniger als 3 Stunden täglich in irgendeiner Tätigkeit."},
{q:"Faustregel für die Summe der Risikolebensversicherung?",a:["1 Monatsgehalt","3–5 Bruttojahresgehälter plus Kredite","100.000 € für alle","10 Jahresgehälter"],c:1,e:"3 bis 5 Bruttojahresgehälter plus offene Kredite."},
{q:"Warum ersetzt eine Unfallversicherung keine BU?",a:["Sie ist zu teuer","Die meisten Berufsunfähigkeiten entstehen durch Krankheit","Sie zahlt nur im Ausland","Sie zahlt nur Rentnern"],c:1,e:"Unfälle sind nur selten die Ursache – meist sind es Krankheiten."},
{q:"Wozu dient eine Überkreuz-Risikolebensversicherung?",a:["Doppelte Leistung","Erbschaftsteuer bei unverheirateten Paaren vermeiden","Günstigerer Beitrag für Raucher","Absicherung von Kindern"],c:1,e:"Versicherungsnehmer und Begünstigter sind dieselbe Person, so fällt keine Erbschaftsteuer an."},
{q:"Wie viele Pflegegrade gibt es?",a:["3","4","5","7"],c:2,e:"Pflegegrad 1 bis 5."},
{q:"Welches Dokument regelt, wer für mich entscheidet, wenn ich es nicht kann?",a:["Testament","Vorsorgevollmacht","Patientenverfügung","Erbschein"],c:1,e:"Die Vorsorgevollmacht."}
]},

{id:"sach", ic:"🏠", title:"Sachversicherungen", sub:"Haftpflicht, Hausrat, Gebäude, Kfz",
lessons:[
{t:"Privathaftpflicht – das Muss", b:`<ul><li>Wer einem anderen schadet, haftet nach § 823 BGB mit seinem <b>gesamten Vermögen – unbegrenzt</b>.</li>
<li>Deckungssumme: mindestens <b>10 Mio. € pauschal</b>.</li>
<li><b>Forderungsausfalldeckung</b>: zahlt, wenn ein anderer mich schädigt und nicht zahlen kann.</li>
<li>Wichtige Bausteine: Mietsachschäden, Schlüsselverlust, geliehene Sachen, <b>deliktunfähige Kinder</b> (unter 7, im Straßenverkehr unter 10 Jahren).</li>
<li>Ein <b>Familientarif</b> schützt Partner und Kinder mit.</li></ul>
<div class="box">Kostet oft nur 50–100 € im Jahr und schützt vor Millionenforderungen.</div>`},
{t:"Hausratversicherung", b:`<ul><li>Versichert ist alles, was man beim Umzug mitnehmen würde: Möbel, Kleidung, Elektronik, Wertsachen.</li>
<li>Gefahren: <b>Feuer, Leitungswasser, Einbruchdiebstahl, Sturm/Hagel</b> (ab Windstärke 8).</li>
<li>Erstattet wird der <b>Neuwert</b>.</li>
<li>Versicherungssumme: meist <b>650 € pro m²</b> Wohnfläche mit <b>Unterversicherungsverzicht</b>.</li>
<li>Extras: Fahrraddiebstahl, Überspannung, <b>Elementarschäden</b>, grobe Fahrlässigkeit.</li></ul>`},
{t:"Wohngebäudeversicherung", b:`<ul><li>Versichert das Gebäude und alles, was fest eingebaut ist (Heizung, Einbauküche je nach Vertrag).</li>
<li>Gefahren: <b>Feuer, Leitungswasser, Sturm/Hagel</b>.</li>
<li><b>Elementarschäden</b> (Starkregen, Überschwemmung, Rückstau, Erdrutsch) müssen meist <b>extra</b> versichert werden – sehr wichtig.</li>
<li><b>Gleitender Neuwert</b> (Wert 1914) schützt vor Unterversicherung.</li>
<li><b>Photovoltaikanlage</b> einschließen oder separat versichern.</li>
<li>Bei Baufinanzierung verlangt die Bank den Nachweis.</li></ul>
<div class="box warn">Neue Solaranlage aufs Dach? Unbedingt dem Gebäudeversicherer melden – sonst droht Unterversicherung.</div>`},
{t:"Kfz-Versicherung", b:`<ul><li><b>Kfz-Haftpflicht ist Pflicht</b>. Empfehlung: <b>100 Mio. € pauschal</b>, deutlich über der gesetzlichen Mindestdeckung.</li>
<li><b>Teilkasko</b>: Diebstahl, Glasbruch, Wildunfall, Sturm, Hagel, Brand.</li>
<li><b>Vollkasko</b>: zusätzlich selbst verschuldete Unfälle und Vandalismus.</li>
<li><b>Schadenfreiheitsklasse (SF)</b>: Jedes schadenfreie Jahr senkt den Beitrag.</li>
<li>Wechselstichtag: Kündigung bis <b>30. November</b> zum 1. Januar.</li></ul>`},
{t:"Rechtsschutzversicherung", b:`<ul><li>Bausteine: <b>Privat, Beruf, Verkehr, Wohnen</b> (Mieter/Eigentümer).</li>
<li>Meist <b>3 Monate Wartezeit</b> (nicht bei Verkehr).</li>
<li>Oft ausgeschlossen: Baurecht (Hausbau!), Scheidung (meist nur Erstberatung), Streitigkeiten, die vor Abschluss begannen.</li>
<li>Selbstbeteiligung senkt den Beitrag.</li></ul>`},
{t:"Weitere Sachversicherungen", b:`<ul><li><b>Bauherrenhaftpflicht</b>: Pflicht für jeden, der baut.</li>
<li><b>Haus- und Grundbesitzerhaftpflicht</b>: bei vermieteten Immobilien oder unbebauten Grundstücken. Das selbst bewohnte Einfamilienhaus ist meist in der Privathaftpflicht enthalten.</li>
<li><b>Tierhalterhaftpflicht</b>: für Hunde und Pferde. In NRW ist sie für große Hunde Pflicht.</li>
<li><b>Gewässerschadenhaftpflicht</b>: bei Öltanks.</li>
<li><b>Photovoltaikversicherung</b>: Technikschäden und Ertragsausfall.</li></ul>`},
{t:"Wichtige Grundbegriffe", b:`<ul><li><b>Unterversicherung</b>: Versicherungssumme zu niedrig → Leistung wird anteilig gekürzt.</li>
<li><b>Neuwert / Zeitwert</b>: Neuwert = Wiederbeschaffung neu, Zeitwert = abzüglich Alter und Abnutzung.</li>
<li><b>Grobe Fahrlässigkeit</b> (z. B. Kerze brennen lassen): mitversichern!</li>
<li><b>Obliegenheiten</b>: Pflichten des Versicherten, z. B. Schaden sofort melden, Fenster schließen.</li>
<li><b>Selbstbeteiligung</b>: Eigenanteil pro Schaden, senkt die Prämie.</li></ul>`}
],

{id:"immobilien", ic:"🔑", title:"Immobilien & Finanzierung", sub:"Eigenkapital, Annuität, Förderung",
lessons:[
{t:"Eigenkapital und Kaufnebenkosten", b:`<p>Beim Kauf fallen Nebenkosten an, die nicht finanziert werden sollten. In <b>NRW</b>:</p>
<table class="t"><tr><td>Grunderwerbsteuer</td><td class="r">6,5 %</td></tr>
<tr><td>Notar und Grundbuch</td><td class="r">ca. 2 %</td></tr>
<tr><td>Makler (falls vorhanden)</td><td class="r">bis 3,57 %</td></tr>
<tr><td><b>Gesamt</b></td><td class="r"><b>ca. 8,5–12 %</b></td></tr></table>
<p>Faustregel: Eigenkapital mindestens in Höhe der Nebenkosten, besser <b>20 % des Kaufpreises</b>. Mehr Eigenkapital = besserer Zins.</p>`},
{t:"Das Annuitätendarlehen", b:`<ul><li>Gleichbleibende Monatsrate aus <b>Zins und Tilgung</b>.</li>
<li>Mit jeder Rate sinkt der Zinsanteil, der Tilgungsanteil steigt.</li>
<li><b>Anfangstilgung</b> mindestens 2 %, besser 3 % – sonst dauert die Rückzahlung sehr lange.</li></ul>
<div class="box">Beispiel: 300.000 € Darlehen, 3,5 % Zins, 2 % Tilgung → (3,5 % + 2 %) × 300.000 € ÷ 12 = <b>1.375 € pro Monat</b>.</div>`},
{t:"Zinsbindung und Anschlussfinanzierung", b:`<ul><li><b>Zinsbindung</b>: 10, 15 oder 20 Jahre fester Zins. Danach ist die <b>Restschuld</b> neu zu finanzieren.</li>
<li><b>Forward-Darlehen</b>: Zins für die Anschlussfinanzierung bis zu ca. 5 Jahre im Voraus sichern (gegen Aufschlag).</li>
<li>Nach 10 Jahren ab Vollauszahlung gibt es ein <b>Sonderkündigungsrecht</b> (§ 489 BGB) mit 6 Monaten Frist.</li>
<li><b>Sondertilgung</b> (z. B. 5 % pro Jahr) vereinbaren – für Bonus oder Erbschaft.</li></ul>`},
{t:"Wie viel Haus kann ich mir leisten?", b:`<ul><li>Die Rate sollte höchstens etwa <b>35–40 % des Haushaltsnettos</b> betragen.</li>
<li><b>Instandhaltungsrücklage</b> einplanen: etwa 1 € pro m² Wohnfläche und Monat, bei älteren Häusern mehr.</li>
<li>Puffer für Elternzeit, Jobwechsel und steigende Kosten einplanen.</li></ul>`},
{t:"Förderungen", b:`<ul><li><b>KfW</b>: zinsgünstige Kredite und Zuschüsse, z. B. für energieeffizientes Bauen, Sanierung, Heizungstausch und Familien.</li>
<li><b>NRW.BANK</b>: Wohneigentums- und Modernisierungsförderung in Nordrhein-Westfalen.</li>
<li><b>Wohn-Riester</b>: für bestehende Riester-Verträge.</li>
<li><b>Bausparvertrag</b>: Zinssicherung für die Zukunft, Wohnungsbauprämie möglich.</li></ul>`},
{t:"Die Finanzierung absichern", b:`<ul><li><b>Risikolebensversicherung</b> mindestens in Höhe der Restschuld.</li>
<li><b>Berufsunfähigkeit</b>: Die Rate muss auch bei Krankheit bezahlbar bleiben.</li>
<li><b>Wohngebäudeversicherung</b> mit Elementarschutz – verlangt die Bank.</li>
<li>In der Bauphase: <b>Bauherrenhaftpflicht</b>, Feuerrohbau-, Bauleistungsversicherung.</li></ul>`}
],
quiz:[
{q:"Wie hoch ist die Grunderwerbsteuer in NRW?",a:["3,5 %","5 %","6,5 %","10 %"],c:2,e:"In Nordrhein-Westfalen 6,5 %."},
{q:"Was bleibt beim Annuitätendarlehen gleich?",a:["Der Zinsanteil","Der Tilgungsanteil","Die Monatsrate","Die Restschuld"],c:2,e:"Die Rate bleibt gleich, die Aufteilung verschiebt sich."},
{q:"300.000 € Darlehen, 3 % Zins, 2 % Tilgung. Monatsrate?",a:["1.000 €","1.250 €","1.500 €","2.000 €"],c:1,e:"5 % × 300.000 € = 15.000 € pro Jahr ÷ 12 = 1.250 €."},
{q:"Was ist ein Forward-Darlehen?",a:["Ein Kredit für das Auto","Zinssicherung für die Anschlussfinanzierung im Voraus","Ein Darlehen ohne Zinsen","Eine Sondertilgung"],c:1,e:"Damit sichert man sich heute den Zins für die Anschlussfinanzierung."},
{q:"Welche Anfangstilgung wird mindestens empfohlen?",a:["0,5 %","1 %","2 %","10 %"],c:2,e:"Mindestens 2 %, besser 3 %."},
{q:"Nach wie vielen Jahren gibt es das gesetzliche Sonderkündigungsrecht?",a:["5","10","15","20"],c:1,e:"Nach 10 Jahren ab Vollauszahlung mit 6 Monaten Frist (§ 489 BGB)."},
{q:"Wie hoch sollte die Kreditrate höchstens sein?",a:["10 % vom Netto","35–40 % vom Haushaltsnetto","60 % vom Brutto","Egal"],c:1,e:"Etwa 35–40 % des Haushaltsnettos."}
]}

["Kausalitätsgegenbeweis","Der Kunde kann nachweisen, dass eine Obliegenheitsverletzung für den Schaden nicht ursächlich war. Dann bleibt der Versicherer leistungspflichtig (außer bei Arglist).","vvg"],
["Schadenminderungspflicht","Der Versicherte muss den Schaden abwenden oder gering halten (§ 82 VVG). Die Kosten dafür (Rettungskosten) ersetzt der Versicherer.","vvg"],
["Unterversicherung","Die Versicherungssumme ist niedriger als der Versicherungswert. Der Schaden wird nur im Verhältnis Versicherungssumme zu Versicherungswert ersetzt (§ 75 VVG).","vvg"],
["Überversicherung","Die Versicherungssumme übersteigt den Versicherungswert erheblich. Beide Seiten können eine Herabsetzung von Summe und Beitrag verlangen (§ 74 VVG).","vvg"],
["Mehrfachversicherung","Dasselbe Risiko ist bei mehreren Versicherern versichert. Die Versicherer haften als Gesamtschuldner, insgesamt aber höchstens bis zur Höhe des Schadens.","vvg"],
["Unterversicherungsverzicht","Der Versicherer verzichtet auf die Kürzung wegen Unterversicherung, z. B. in der Hausrat bei ausreichender Summe je m².","vvg"],
["Selbstbeteiligung","Eigenanteil des Kunden an jedem Schaden. Senkt den Beitrag.","vvg"],
["Subsidiaritätsklausel","Der Vertrag leistet nur nachrangig, wenn kein anderer Vertrag zahlt.","vvg"],
["Forderungsübergang (Regress)","Hat der Versicherer gezahlt, gehen die Ersatzansprüche des Kunden gegen den Schädiger auf ihn über (§ 86 VVG).","vvg"],
["Kündigung nach Schadenfall","Nach einem Versicherungsfall können in der Schadenversicherung beide Seiten innerhalb eines Monats nach Abschluss der Regulierung kündigen (§ 92 VVG).","vvg"],
["Sonderkündigungsrecht bei Beitragserhöhung","Erhöht der Versicherer den Beitrag ohne Leistungsverbesserung, kann der Kunde innerhalb eines Monats nach Mitteilung kündigen (§ 40 VVG).","vvg"],
["Vertragslaufzeit (§ 11 VVG)","Verträge verlängern sich stillschweigend um höchstens ein Jahr. Die Kündigungsfrist liegt zwischen einem und drei Monaten. Verträge über drei Jahre sind zum Ende des dritten Jahres kündbar.","vvg"],
["Verjährung","Ansprüche aus dem Versicherungsvertrag verjähren in der Regel nach drei Jahren, beginnend mit dem Ende des Jahres, in dem sie entstanden sind.","vvg"],
["Versicherungswert","Tatsächlicher Wert des versicherten Gegenstands, z. B. Neuwert oder Zeitwert.","vvg"],
["Neuwert","Betrag, der nötig ist, um eine Sache gleicher Art und Güte neu zu beschaffen.","vvg"],
["Zeitwert","Neuwert abzüglich Wertminderung durch Alter und Abnutzung.","vvg"],
["Sachverständigenverfahren","Bei Streit über die Schadenhöhe bestimmen Versicherer und Kunde je einen Sachverständigen; bei Uneinigkeit entscheidet ein Obmann.","vvg"],

/* ---------- Sozialversicherung ---------- */
["Sozialversicherung","Fünf Zweige: Kranken-, Pflege-, Renten-, Arbeitslosen- und Unfallversicherung.","sv"],
["Beitragsbemessungsgrenze","Einkommen bis zu dieser Grenze ist beitragspflichtig. Für Renten- und Arbeitslosenversicherung liegt sie höher als für Kranken- und Pflegeversicherung. Sie wird jährlich angepasst.","sv"],
["Versicherungspflichtgrenze","Jahresarbeitsentgeltgrenze. Angestellte mit höherem Einkommen können sich privat krankenversichern. Wird jährlich angepasst.","sv"],
["Geringfügige Beschäftigung","Minijob bis zur Geringfügigkeitsgrenze. Rentenversicherungspflicht mit Befreiungsmöglichkeit, keine Kranken- und Arbeitslosenversicherung für den Arbeitnehmer.","sv"],
["Familienversicherung","Kinder und Ehepartner ohne bzw. mit geringem eigenem Einkommen sind in der GKV beitragsfrei mitversichert.","sv"],
["Umlageverfahren","Die Beiträge der heutigen Erwerbstätigen finanzieren direkt die heutigen Renten (Generationenvertrag).","sv"],
["Kapitaldeckungsverfahren","Jeder spart für die eigene Versorgung Kapital an, z. B. in der privaten Rentenversicherung oder der PKV.","sv"],
["Entgeltpunkte","Für ein Jahr mit Durchschnittsverdienst gibt es einen Entgeltpunkt. Rente = Entgeltpunkte × Zugangsfaktor × aktueller Rentenwert × Rentenartfaktor.","sv"],
["Aktueller Rentenwert","Monatsrente für einen Entgeltpunkt. Wird jährlich zum 1. Juli angepasst.","sv"],
["Zugangsfaktor","Berücksichtigt Abschläge (0,3 % je Monat früher) oder Zuschläge (0,5 % je Monat später) bei Rentenbeginn.","sv"],
["Regelaltersgrenze","Alter für die reguläre Altersrente ohne Abschläge. Steigt schrittweise auf 67 Jahre (ab Jahrgang 1964).","sv"],
["Allgemeine Wartezeit","Mindestversicherungszeit von 5 Jahren für die Regelaltersrente und Renten wegen Erwerbsminderung.","sv"],
["Langjährig Versicherte","Mit 35 Jahren Wartezeit ist eine Altersrente ab 63 mit Abschlägen möglich.","sv"],
["Besonders langjährig Versicherte","Mit 45 Jahren Wartezeit ist eine abschlagsfreie Rente zwei Jahre vor der Regelaltersgrenze möglich (steigt schrittweise auf 65).","sv"],
["Erwerbsminderungsrente","Voll: unter 3 Stunden täglich arbeitsfähig. Teilweise: 3 bis unter 6 Stunden. Voraussetzung: 5 Jahre Wartezeit und 3 Jahre Pflichtbeiträge in den letzten 5 Jahren.","sv"],
["Berufsunfähigkeitsrente (gesetzlich)","Gibt es nur noch für Versicherte, die vor dem 2. Januar 1961 geboren sind.","sv"],
["Große Witwenrente","55 % der Rente des Verstorbenen (altes Recht 60 %), wenn der Hinterbliebene ein bestimmtes Alter erreicht hat (steigt auf 47), ein Kind erzieht oder erwerbsgemindert ist. Eigenes Einkommen wird angerechnet.","sv"],
["Kleine Witwenrente","25 % der Rente des Verstorbenen, nach neuem Recht für höchstens 24 Monate.","sv"],
["Waisenrente","Halbwaisenrente 10 %, Vollwaisenrente 20 % der Rente des Verstorbenen, grundsätzlich bis 18 bzw. in Ausbildung bis 27.","sv"],
["Rentenniveau","Verhältnis einer Standardrente nach 45 Jahren Durchschnittsverdienst zum aktuellen Durchschnittsverdienst, vor Steuern.","sv"],
["Renteninformation","Jährliche Mitteilung der Deutschen Rentenversicherung ab 27 Jahren mit bisheriger und hochgerechneter Rente.","sv"],
["Entgeltfortzahlung","Bei Krankheit zahlt der Arbeitgeber das Gehalt bis zu 6 Wochen weiter.","sv"],
["Krankengeld","Leistung der GKV nach der Entgeltfortzahlung: 70 % des Bruttoentgelts, höchstens 90 % des Nettoentgelts, für bis zu 78 Wochen innerhalb von drei Jahren wegen derselben Krankheit.","sv"],
["Arbeitslosengeld I","60 % des pauschalierten Nettoentgelts, mit Kind 67 %. Voraussetzung: mindestens 12 Monate Versicherungspflicht in den letzten 30 Monaten.","sv"],
["Gesetzliche Unfallversicherung","Versichert Arbeitsunfälle, Wegeunfälle und Berufskrankheiten. Träger sind Berufsgenossenschaften und Unfallkassen; Beiträge zahlt allein der Arbeitgeber.","sv"],
["Berufsgenossenschaft","Träger der gesetzlichen Unfallversicherung für die gewerbliche Wirtschaft.","sv"],
["Verletztenrente","Rente der gesetzlichen Unfallversicherung ab einer Minderung der Erwerbsfähigkeit von mindestens 20 %.","sv"],
["Wegeunfall","Unfall auf dem direkten Weg zwischen Wohnung und Arbeitsstätte. Gesetzlich unfallversichert.","sv"],
["Grundsicherung im Alter","Sozialleistung für Rentner, deren Einkommen nicht für den Lebensunterhalt reicht. Wird von den Sozialämtern gezahlt.","sv"],

/* ---------- Altersvorsorge & Förderung ---------- */
["3-Schichten-Modell","Einteilung der Altersvorsorge nach steuerlicher Behandlung. Schicht 1: Basisversorgung. Schicht 2: Zusatzversorgung (bAV, Riester, Altersvorsorgedepot). Schicht 3: private Vorsorge.","av"],
["Rentenlücke","Differenz zwischen dem gewünschten Alterseinkommen und den erwarteten Renten.","av"],
["Basisrente (Rürup)","Schicht 1. Beiträge sind bis zum Höchstbetrag als Sonderausgaben absetzbar. Nur lebenslange Rente ab 62, nicht vererbbar, beleihbar, übertragbar oder kapitalisierbar.","av"],
["Riester-Rente","Staatlich geförderte private Altersvorsorge der Schicht 2. Neuabschlüsse nur bis Ende 2026, bestehende Verträge haben Bestandsschutz.","av"],
["Altersvorsorgedepot","Ab 1. Januar 2027 gefördertes Fonds- und ETF-Depot als Nachfolger von Riester, ohne Garantiepflicht. Bis 540 € Grundzulage, 300 € je Kind. Auszahlung ab 65.","av"],
["Grundzulage","Im Altersvorsorgedepot 50 % auf die ersten 360 € und 25 % auf 360 bis 1.800 € Eigenbeitrag, höchstens 540 € im Jahr. Mindestbeitrag 120 €.","av"],
["Kinderzulage","Im Altersvorsorgedepot 1 € je eingezahltem Euro, höchstens 300 € je kindergeldberechtigtem Kind und Jahr.","av"],
["Berufseinsteigerbonus","Einmalig 200 € beim Abschluss eines geförderten Altersvorsorgevertrags vor dem 25. Geburtstag.","av"],
["Standarddepot","Pflichtangebot jedes Anbieters beim Altersvorsorgedepot mit vorgegebener Anlage und Effektivkosten von höchstens 1 % pro Jahr.","av"],
["Frühstartrente","Geplante staatliche Einzahlung von 10 € pro Monat für Kinder von 6 bis 18 Jahren in ein Altersvorsorgedepot. Gesetzgebung Stand Oktober 2026 noch nicht abgeschlossen.","av"],
["Auszahlplan","Das Kapital wird in Raten ausgezahlt. Beim Altersvorsorgedepot mindestens bis zum 85. Lebensjahr.","av"],
["Schädliche Verwendung","Verwendung von gefördertem Kapital entgegen den Regeln, z. B. Kündigung eines Riester-Vertrags. Zulagen und Steuervorteile müssen zurückgezahlt werden.","av"],
["Wohn-Riester","Einsatz von Riester-Kapital für selbst genutztes Wohneigentum. Die Besteuerung erfolgt über ein Wohnförderkonto.","av"],
["Betriebliche Altersversorgung (bAV)","Altersvorsorge über den Arbeitgeber. Schicht 2. Es gibt fünf Durchführungswege.","av"],
["Entgeltumwandlung","Teil des Bruttogehalts wird in eine Betriebsrente eingezahlt. Rechtsanspruch für Arbeitnehmer.","av"],
["Arbeitgeberzuschuss bAV","Bei Entgeltumwandlung muss der Arbeitgeber 15 % zuschießen, soweit er Sozialversicherungsbeiträge spart.","av"],
["Durchführungswege bAV","Direktversicherung, Pensionskasse, Pensionsfonds (extern) sowie Unterstützungskasse und Direktzusage (intern).","av"],
["Direktversicherung","Lebens- oder Rentenversicherung, die der Arbeitgeber für den Arbeitnehmer abschließt. Häufigster bAV-Weg bei kleinen Firmen.","av"],
["Pensionskasse","Rechtsfähige Versorgungseinrichtung, die Betriebsrenten zahlt. Unterliegt der Versicherungsaufsicht.","av"],
["Pensionsfonds","Externe Versorgungseinrichtung mit freierer Kapitalanlage als Pensionskassen.","av"],
["Unterstützungskasse","Rechtsfähige Einrichtung des Arbeitgebers ohne Rechtsanspruch des Arbeitnehmers gegen die Kasse; der Arbeitgeber haftet.","av"],
["Direktzusage","Der Arbeitgeber zahlt die Betriebsrente selbst und bildet dafür Pensionsrückstellungen.","av"],
["PSVaG","Pensions-Sicherungs-Verein. Sichert Direktzusage, Unterstützungskasse und Pensionsfonds bei Insolvenz des Arbeitgebers ab.","av"],
["Unverfallbarkeit","Anspruch auf die Betriebsrente bleibt beim Jobwechsel erhalten. Bei Entgeltumwandlung sofort, bei Arbeitgeberfinanzierung nach 3 Jahren Zusagedauer und ab 21 Jahren.","av"],
["Portabilität","Recht, das Kapital einer bAV beim Arbeitgeberwechsel zum neuen Arbeitgeber mitzunehmen (bei externen Durchführungswegen).","av"],
["Steuerfreiheit bAV (§ 3 Nr. 63 EStG)","Beiträge in Direktversicherung, Pensionskasse und Pensionsfonds sind bis 8 % der Beitragsbemessungsgrenze (RV) steuerfrei und bis 4 % sozialversicherungsfrei.","av"],

/* ---------- Leben, Rente & BU ---------- */
["Risikolebensversicherung","Zahlt nur im Todesfall während der Laufzeit. Kein Sparanteil, deshalb günstig.","leben"],
["Kapitallebensversicherung","Zahlt im Todesfall oder bei Ablauf. Verbindet Todesfallschutz und Sparen. Für Neuverträge seit 2005 steuerlich weniger attraktiv.","leben"],
["Restschuldversicherung","Sichert einen Kredit bei Tod, oft auch Arbeitsunfähigkeit oder Arbeitslosigkeit ab.","leben"],
["Sterbegeldversicherung","Kleine Lebensversicherung zur Deckung der Bestattungskosten.","leben"],
["Fallende Versicherungssumme","Die Todesfallsumme sinkt mit der Laufzeit, passend zur Restschuld eines Kredits.","leben"],
["Überkreuzversicherung","Partner A versichert das Leben von B und umgekehrt. Vermeidet Erbschaftsteuer, vor allem bei unverheirateten Paaren.","leben"],
["Private Rentenversicherung","Zahlt eine lebenslange Rente oder wahlweise eine Kapitalabfindung. Sichert das Langlebigkeitsrisiko ab.","leben"],
["Aufgeschobene Rentenversicherung","Beitragszahlung über viele Jahre, die Rente beginnt erst später.","leben"],
["Sofortrente","Gegen Einmalbeitrag beginnt die Rentenzahlung sofort.","leben"],
["Rentengarantiezeit","Stirbt die versicherte Person, läuft die Rente bis zum Ende dieser Zeit an die Hinterbliebenen weiter.","leben"],
["Beitragsrückgewähr","Bei Tod vor Rentenbeginn werden die eingezahlten Beiträge zurückgezahlt.","leben"],
["Kapitalwahlrecht","Recht, statt der Rente eine einmalige Kapitalauszahlung zu wählen.","leben"],
["Fondsgebundene Rentenversicherung","Die Sparbeiträge fließen in Investmentfonds. Höhere Chancen, aber der Kunde trägt das Anlagerisiko.","leben"],
["Indexpolice","Die Überschüsse werden an die Entwicklung eines Index gekoppelt, mit Garantie für das eingezahlte Kapital.","leben"],
["Höchstrechnungszins","Maximaler Garantiezins für neue Lebensversicherungen. Seit 1. Januar 2025 1,0 %.","leben"],
["Überschussbeteiligung","Anteil des Kunden an den Gewinnen des Versicherers aus Kapitalanlage, Risiko und Kosten. Nicht garantiert.","leben"],
["Bewertungsreserven","Differenz zwischen Markt- und Buchwert der Kapitalanlagen. Kunden werden bei Vertragsende zur Hälfte beteiligt.","leben"],
["Protektor","Sicherungsfonds für Lebensversicherer. Übernimmt Verträge, wenn ein Versicherer insolvent wird.","leben"],
["Rückkaufswert","Betrag, den der Kunde bei Kündigung erhält. Liegt in den ersten Jahren oft unter den Beiträgen.","leben"],
["Zillmerung","Verrechnung der Abschlusskosten mit den ersten Beiträgen. Gesetzlich müssen sie auf mindestens 5 Jahre verteilt werden (§ 169 VVG).","leben"],
["Stornoabzug","Abzug vom Rückkaufswert bei Kündigung. Muss vereinbart, beziffert und angemessen sein.","leben"],
["Beitragsfreistellung","Der Vertrag läuft ohne weitere Beiträge mit reduzierter Leistung weiter. Alternative zur Kündigung.","leben"],
["Policendarlehen","Darlehen des Versicherers in Höhe eines Teils des Rückkaufswerts, ohne den Vertrag zu kündigen.","leben"],
["Dynamik","Regelmäßige Erhöhung von Beitrag und Leistung ohne neue Gesundheitsprüfung, z. B. zum Ausgleich der Inflation.","leben"],
["Berufsunfähigkeitsversicherung","Zahlt eine Rente, wenn die versicherte Person ihren zuletzt ausgeübten Beruf voraussichtlich mindestens 6 Monate zu mindestens 50 % nicht mehr ausüben kann.","leben"],
["Prognosezeitraum","Zeitraum, für den die Berufsunfähigkeit voraussichtlich bestehen muss. In guten Tarifen 6 Monate.","leben"],
["Abstrakte Verweisung","Der Versicherer verweist auf einen anderen Beruf, den der Versicherte ausüben könnte, auch wenn er ihn nicht ausübt. Gute Tarife verzichten darauf.","leben"],
["Konkrete Verweisung","Der Versicherer verweist auf einen tatsächlich ausgeübten, vergleichbaren Beruf mit ähnlichem Einkommen und Ansehen.","leben"],
["Nachversicherungsgarantie","Erhöhung der Leistung ohne neue Gesundheitsprüfung bei bestimmten Ereignissen wie Heirat, Geburt oder Immobilienkauf.","leben"],
["AU-Klausel","Leistung aus der BU bei längerer Arbeitsunfähigkeit (Krankschreibung), zeitlich begrenzt, ohne Nachweis der Berufsunfähigkeit.","leben"],
["Leistungsdynamik","Garantierte jährliche Steigerung einer laufenden BU-Rente.","leben"],
["Erwerbsunfähigkeitsversicherung","Leistet erst, wenn der Versicherte praktisch keine Tätigkeit mehr ausüben kann. Günstiger, aber schwächer als die BU.","leben"],
["Grundfähigkeitsversicherung","Zahlt eine Rente bei Verlust bestimmter Fähigkeiten wie Sehen, Gehen, Treppensteigen oder Hände gebrauchen.","leben"],
["Dread-Disease-Versicherung","Schwere-Krankheiten-Versicherung. Einmalzahlung bei Diagnose z. B. von Krebs, Herzinfarkt oder Schlaganfall.","leben"],
["Sterbetafel","Statistische Übersicht der Sterbewahrscheinlichkeiten. Grundlage für die Beitragsberechnung in der Lebensversicherung.","leben"],

/* ---------- Kranken & Pflege ---------- */
["GKV","Gesetzliche Krankenversicherung. Beitrag nach Einkommen, Sachleistungsprinzip, Familienversicherung.","kv"],
["PKV","Private Krankenversicherung. Beitrag nach Eintrittsalter, Gesundheit und Tarif. Für Selbstständige, Beamte und Angestellte über der Versicherungspflichtgrenze.","kv"],
["Zusatzbeitrag","Kassenindividueller Beitrag in der GKV zusätzlich zum allgemeinen Beitragssatz. Bei Erhöhung besteht ein Sonderkündigungsrecht.","kv"],
["Sachleistungsprinzip","GKV: Der Patient erhält die Leistung, die Kasse rechnet direkt mit dem Arzt ab.","kv"],
["Kostenerstattungsprinzip","PKV: Der Patient erhält die Rechnung, bezahlt sie und reicht sie beim Versicherer ein.","kv"],
["GOÄ","Gebührenordnung für Ärzte. Grundlage der Abrechnung von Privatpatienten mit Steigerungsfaktoren.","kv"],
["Altersrückstellungen","Teil der PKV-Beiträge, der angespart wird, um Beitragssteigerungen im Alter zu dämpfen.","kv"],
["Übertragungswert","Teil der Altersrückstellungen (im Umfang des Basistarifs), der beim Wechsel des PKV-Versicherers mitgenommen werden kann.","kv"],
["Basistarif","PKV-Tarif mit GKV-ähnlichen Leistungen und Annahmepflicht. Beitrag höchstens wie der GKV-Höchstbeitrag.","kv"],
["Standardtarif","Sozialtarif der PKV für ältere Versicherte mit Verträgen vor 2009.","kv"],
["Notlagentarif","Tarif für PKV-Versicherte mit Beitragsrückständen. Nur Notfall- und Akutversorgung.","kv"],
["Kontrahierungszwang","Annahmepflicht, z. B. der PKV im Basistarif oder der Kfz-Haftpflichtversicherer.","kv"],
["Beitragsrückerstattung (PKV)","Rückzahlung eines Teils der Beiträge, wenn im Jahr keine Rechnungen eingereicht wurden.","kv"],
["Wartezeit (KV)","Zeit nach Vertragsbeginn ohne Leistung: allgemein 3 Monate, für Entbindung, Psychotherapie und Zahnersatz meist 8 Monate.","kv"],
["Krankentagegeld","Ersetzt den Verdienstausfall bei Arbeitsunfähigkeit. Wichtig für Selbstständige und Angestellte mit Einkommen über der Beitragsbemessungsgrenze.","kv"],
["Krankenhaustagegeld","Fester Betrag für jeden Tag im Krankenhaus, frei verwendbar.","kv"],
["Ergänzungsversicherung","Private Zusatzversicherung für GKV-Versicherte, z. B. Zahn, stationär (Chefarzt, Einbettzimmer), ambulant oder Brille.","kv"],
["Auslandsreisekrankenversicherung","Übernimmt Behandlungskosten im Ausland und einen medizinisch sinnvollen Rücktransport.","kv"],
["Anwartschaftsversicherung","Sichert den Gesundheitszustand und ggf. das Eintrittsalter für einen späteren PKV-Tarif, z. B. bei Auslandsaufenthalt.","kv"],
["Soziale Pflegeversicherung","Teilabsicherung für Pflegebedürftige. Pflege folgt Krankenversicherung: GKV-Versicherte in der sozialen, PKV-Versicherte in der privaten Pflegepflichtversicherung.","kv"],
["Pflegegrad","Einstufung der Pflegebedürftigkeit von 1 bis 5 durch den Medizinischen Dienst nach dem Grad der Selbstständigkeit.","kv"],
["Pflegegeld","Geldleistung der Pflegeversicherung bei Pflege durch Angehörige (ab Pflegegrad 2).","kv"],
["Pflegesachleistung","Leistung für einen ambulanten Pflegedienst.","kv"],
["Eigenanteil im Pflegeheim","Kosten, die Pflegebedürftige im Heim selbst tragen müssen, z. B. für Unterkunft, Verpflegung und Investitionskosten.","kv"],
["Pflegetagegeld","Private Zusatzversicherung. Zahlt je nach Pflegegrad einen Tagessatz, frei verwendbar.","kv"],
["Pflegekostenversicherung","Erstattet einen Teil der Pflegekosten, die die gesetzliche Pflegeversicherung nicht übernimmt, gegen Nachweis.","kv"],
["Pflegerentenversicherung","Lebensversicherung, die bei Pflegebedürftigkeit eine Rente zahlt.","kv"],
["Pflege-Bahr","Staatlich geförderte Pflegetagegeldversicherung mit 5 € Zulage pro Monat, ohne Gesundheitsprüfung.","kv"],

/* ---------- Sach, Haftpflicht, Kfz & Unfall ---------- */
["Verschuldenshaftung","Haftung für vorsätzlich oder fahrlässig verursachte Schäden (§ 823 BGB), unbegrenzt mit dem gesamten Vermögen.","sach"],
["Gefährdungshaftung","Haftung ohne Verschulden für eine erlaubte, aber gefährliche Sache, z. B. Kfz-Halter (§ 7 StVG) oder Halter von Hunden und Pferden (§ 833 BGB).","sach"],
["Privathaftpflichtversicherung","Prüft die Haftung, wehrt unberechtigte Ansprüche ab (passiver Rechtsschutz) und zahlt berechtigte Schadenersatzansprüche.","sach"],
["Deckungssumme","Höchstbetrag, den der Versicherer pro Schadenfall zahlt. Empfehlung Privathaftpflicht: mindestens 10 Mio. € pauschal.","sach"],
["Personenschaden","Verletzung oder Tod eines Menschen, inkl. Folgekosten wie Verdienstausfall und Schmerzensgeld.","sach"],
["Sachschaden","Beschädigung oder Zerstörung einer Sache.","sach"],
["Vermögensschaden","Unechter Vermögensschaden: Folge eines Personen- oder Sachschadens. Echter Vermögensschaden: reiner finanzieller Schaden ohne Personen- oder Sachschaden.","sach"],
["Deliktunfähigkeit","Kinder unter 7 Jahren haften nicht, im fließenden Straßenverkehr unter 10 Jahren (§ 828 BGB). Viele Tarife zahlen trotzdem.","sach"],
["Gefälligkeitsschaden","Schaden bei einer unentgeltlichen Hilfe, z. B. beim Umzug von Freunden. Oft nur versichert, wenn ausdrücklich eingeschlossen.","sach"],
["Forderungsausfalldeckung","Zahlt, wenn der Versicherte von einem Dritten geschädigt wird und dieser nicht zahlen kann.","sach"],
["Mietsachschaden","Schäden an gemieteten Räumen, z. B. Wasserflecken im Parkett. Baustein der Privathaftpflicht.","sach"],
["Tierhalterhaftpflicht","Pflicht für Hunde in mehreren Bundesländern, in NRW für große und gefährliche Hunde. Halter haften verschuldensunabhängig.","sach"],
["Haus- und Grundbesitzerhaftpflicht","Für vermietete Immobilien und unbebaute Grundstücke. Das selbst bewohnte Einfamilienhaus ist meist in der Privathaftpflicht enthalten.","sach"],
["Bauherrenhaftpflicht","Sichert die Haftung des Bauherrn für Gefahren auf der Baustelle ab.","sach"],
["Gewässerschadenhaftpflicht","Für Schäden durch auslaufende Stoffe, z. B. aus einem Öltank.","sach"],
["Hausratversicherung","Versichert bewegliche Sachen im Haushalt zum Neuwert gegen Feuer, Leitungswasser, Einbruchdiebstahl, Raub, Vandalismus nach Einbruch sowie Sturm und Hagel.","sach"],
["Versicherungsort","Ort, an dem Versicherungsschutz besteht, z. B. die im Vertrag genannte Wohnung.","sach"],
["Außenversicherung","Hausrat ist vorübergehend auch außerhalb der Wohnung versichert, meist bis zu 3 Monate und begrenzt auf einen Teil der Versicherungssumme.","sach"],
["Einbruchdiebstahl","Täter dringt in einen Raum ein, z. B. durch Aufbrechen oder mit falschem Schlüssel. Einfacher Diebstahl ohne Einbruch ist nicht versichert.","sach"],
["Wertsachen","Schmuck, Bargeld, Kunst usw. In der Hausrat gelten dafür Entschädigungsgrenzen.","sach"],
["Überspannungsschäden","Schäden an Elektrogeräten durch Blitz-Überspannung. Häufiger Zusatzbaustein.","sach"],
["Wohngebäudeversicherung","Versichert Gebäude und fest eingebaute Bestandteile gegen Feuer, Leitungswasser sowie Sturm und Hagel.","sach"],

function ringSvg(p){const r=26,c=2*Math.PI*r;return `<svg width="70" height="70" viewBox="0 0 70 70" aria-label="${p} Prozent"><circle cx="35" cy="35" r="${r}" fill="none" stroke="var(--soft)" stroke-width="8"/><circle cx="35" cy="35" r="${r}" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 35 35)"/><text x="35" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${p}%</text></svg>`;}

/* ================= FRAGEN-POOL ================= */
const POOL={}; // id -> {id,q,a,c:[..],e,tag}
TOPICS.forEach(t=>t.quiz.forEach((q,i)=>{POOL["t:"+t.id+":"+i]={id:"t:"+t.id+":"+i,q:q.q,a:q.a,c:[].concat(q.c),e:q.e,tag:t.ic+" "+t.title,src:"t:"+t.id};}));
Object.entries(IHK).forEach(([b,B])=>B.qs.forEach((x,i)=>{POOL[b+":"+i]={id:b+":"+i,q:x[1],a:x[2],c:[].concat(x[3]),e:x[4],tag:B.short+" · "+B.cats[x[0]],cat:x[0],src:b};}));
const ALLQ=Object.values(POOL);
function newCalc(){const g=pick(GEN)();return Object.assign({num:true,tag:"🧮 "+g.t},g);}

/* Streak: Tage mit Training */
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400);save();}}
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(S.days.includes(k)){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}
function record(q,ok){
  if(q.num){S.calc.n++;if(ok)S.calc.r++;save();return;}
  if(!q.id)return;
  const s=S.stats[q.id]||{n:0,r:0};s.n++;if(ok)s.r++;s.l=ok?1:0;S.stats[q.id]=s;
  if(!ok)S.wrong[q.id]=2;else if(S.wrong[q.id]){S.wrong[q.id]--;if(S.wrong[q.id]<=0)delete S.wrong[q.id];}
  save();
}
function mastery(ids){if(!ids.length)return 0;return Math.round(ids.filter(id=>S.stats[id]&&S.stats[id].l).length/ids.length*100);}

/* ================= QUIZ-ENGINE ================= */
let Q=null,TIMER=null;
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;}}
function startSession(o){
  stopTimer();
  Q=Object.assign({i:0,score:0,mode:"learn",ans:[]},o);
  Q.qs=Q.qs.map(q=>q.num?q:Object.assign({},q,{order:shuffle(q.a.map((_,k)=>k))}));
  if(!Q.qs.length){V.innerHTML=`<div class="card"><p>${o.empty||"Keine Fragen vorhanden."}</p></div><a class="btn block" href="#/training">Zum Training</a>`;setTitle(o.title,true);return;}
  setTitle(Q.title,true);
  if(Q.minutes){Q.end=Date.now()+Q.minutes*60000;TIMER=setInterval(()=>{const el=$("#tm");const r=Math.max(0,Q.end-Date.now());if(el)el.textContent="⏱ "+Math.floor(r/60000)+":"+String(Math.floor(r/1000)%60).padStart(2,"0");if(r<=0){stopTimer();alert("Die Zeit ist abgelaufen.");finishExam();}},1000);}
  renderQ();
}
function quiz(id){
  if(id==="mix")return startSession({title:"Mix-Quiz",qs:shuffle(ALLQ.filter(q=>q.src.startsWith("t:"))).slice(0,10),key:null});
  const t=T(id);if(!t)return home();
  startSession({title:"Quiz: "+t.title,qs:t.quiz.map((_,i)=>POOL["t:"+id+":"+i]),key:id,back:"#/t/"+id});
}
function renderQ(){
  const q=Q.qs[Q.i],multi=!q.num&&q.c.length>1,exam=Q.mode==="exam";
  const sel=Q.ans[Q.i]||[];
  V.innerHTML=`<div class="qhead"><span>Frage ${Q.i+1} / ${Q.qs.length}</span><span id="tm"></span><span>${exam?"":"✓ "+Q.score}</span></div>
  <div class="bar" style="margin:6px 0 12px"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <p class="muted small">${q.tag||""}</p>
  <h2 style="font-size:19px">${q.q}</h2>
  ${q.num?`<label class="f">Deine Lösung${q.u?" in "+q.u:""}</label><input id="num" type="text" inputmode="decimal" placeholder="z. B. 1234,56" autocomplete="off">
   <button class="btn block" id="chk">Prüfen</button>`
  :`${multi?`<p class="small" style="color:var(--brand2);font-weight:600">Mehrere Antworten sind richtig – wähle alle aus.</p>`:""}
   <div id="opts">${q.order.map(k=>`<button class="opt ${sel.includes(k)?"pick":""}" data-k="${k}">${multi?(sel.includes(k)?"☑ ":"☐ "):""}${q.a[k]}</button>`).join("")}</div>
   ${multi||exam?`<button class="btn block" id="chk">${exam?(Q.i===Q.qs.length-1?"Prüfung abgeben":"Weiter ›"):"Antwort prüfen"}</button>`:""}
   ${exam&&Q.i>0?`<button class="btn sec block" id="prv">‹ Vorherige Frage</button>`:""}`}
  <div id="fb"></div>`;
  if(Q.minutes){const r=Math.max(0,Q.end-Date.now());$("#tm").textContent="⏱ "+Math.floor(r/60000)+":"+String(Math.floor(r/1000)%60).padStart(2,"0");}
  if(q.num){
    const go=()=>{const v=parseFloat($("#num").value.replace(/\./g,"").replace(",",".").replace(/[^\d.\-]/g,""));if(!isFinite(v)){alert("Bitte eine Zahl eingeben.");return;}checkNum(v);};
    $("#chk").onclick=go;$("#num").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  }else{
    V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(q.done)return;const k=+b.dataset.k;
      if(multi){const s=Q.ans[Q.i]||[];Q.ans[Q.i]=s.includes(k)?s.filter(x=>x!==k):s.concat(k);renderQ();}
      else if(exam){Q.ans[Q.i]=[k];renderQ();}
      else{Q.ans[Q.i]=[k];checkOpt();}
    });
    if($("#chk"))$("#chk").onclick=()=>{
      if(exam){if(Q.i===Q.qs.length-1){const open=Q.qs.filter((_,i)=>!(Q.ans[i]||[]).length).length;if(open&&!confirm(open+" Frage(n) unbeantwortet. Trotzdem abgeben?"))return;finishExam();}else{Q.i++;renderQ();}}
      else{if(!(Q.ans[Q.i]||[]).length){alert("Bitte mindestens eine Antwort wählen.");return;}checkOpt();}
    };
    if($("#prv"))$("#prv").onclick=()=>{Q.i--;renderQ();};
  }
  window.scrollTo(0,0);
}
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function checkOpt(){
  const q=Q.qs[Q.i];if(q.done)return;q.done=1;
  const sel=Q.ans[Q.i]||[],ok=same(sel,q.c);if(ok)Q.score++;record(q,ok);
  V.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;if(q.c.includes(k))b.classList.add("ok");else if(sel.includes(k))b.classList.add("bad");});
  feedback(ok,q.e);
}
function checkNum(v){
  const q=Q.qs[Q.i];if(q.done)return;q.done=1;
  const ok=Math.abs(v-q.ans)<=q.tol;if(ok)Q.score++;record(q,ok);
  $("#num").disabled=true;$("#chk").remove();
  feedback(ok,`Lösung: <b>${fm(q.ans,q.u==="%"||q.u==="Jahre"||q.u===""?(q.u==="%"?2:1):2)} ${q.u}</b><br>${q.e}`);
}
function feedback(ok,txt){
  const last=Q.i===Q.qs.length-1;
  $("#fb").innerHTML=`<div class="box ${ok?"":"warn"}"><b>${ok?"Richtig! ✓":"Leider falsch."}</b> ${txt}</div>
  <button class="btn block" id="nx">${last?"Ergebnis anzeigen":"Nächste Frage ›"}</button>`;
  $("#nx").onclick=()=>{if(last)result();else{Q.i++;renderQ();}};
  $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finishExam(){
  stopTimer();
  Q.qs.forEach((q,i)=>{const ok=same(Q.ans[i]||[],q.c);if(ok)Q.score++;record(q,ok);q.ok=ok;});
  const pct=Math.round(Q.score/Q.qs.length*100);
  S.exams.push({b:Q.bank,p:pct,d:today()});S.exams=S.exams.slice(-30);markDay();save();
  const wrong=Q.qs.map((q,i)=>[q,i]).filter(([q])=>!q.ok);
  const byCat={};Q.qs.forEach(q=>{const c=q.tag.split(" · ")[1]||"";byCat[c]=byCat[c]||[0,0];byCat[c][1]++;if(q.ok)byCat[c][0]++;});
  V.innerHTML=`<div class="card" style="text-align:center">${ringSvg(pct)}<h2>${Q.score} von ${Q.qs.length} richtig</h2>
  <p>${pct>=70?"Stark – auf Prüfungsniveau! 🏆":pct>=50?"Knapp – die Schwachstellen unten gezielt üben.":"Noch nicht prüfungsreif – weiter trainieren."}</p></div>
  <h3>Ergebnis nach Gebiet</h3><div class="card"><table class="t">${Object.entries(byCat).map(([c,[r,n]])=>`<tr><td>${c}</td><td class="r">${r}/${n}</td></tr>`).join("")}</table></div>
  ${wrong.length?`<h3>Deine Fehler (${wrong.length})</h3>`+wrong.map(([q,i])=>`<div class="card"><b>${q.q}</b><p class="small">Richtig: ${q.c.map(k=>q.a[k]).join(" · ")}</p>${(Q.ans[i]||[]).length?`<p class="small" style="color:var(--bad)">Deine Antwort: ${(Q.ans[i]).map(k=>q.a[k]).join(" · ")}</p>`:`<p class="small muted">Nicht beantwortet</p>`}<p class="small muted">${q.e}</p></div>`).join(""):""}
  <a class="btn block" href="#/fehler">Fehler gezielt üben</a><a class="btn sec block" href="#/ihk/${Q.bank}">Zurück zur Übersicht</a>`;
  window.scrollTo(0,0);
}
function result(){
  stopTimer();markDay();
  const pct=Math.round(Q.score/Q.qs.length*100);
  if(Q.key){S.best[Q.key]=Math.max(S.best[Q.key]||0,pct);save();}
  const msg=pct>=90?"Ausgezeichnet! 🏆":pct>=70?"Sehr gut! 👍":pct>=50?"Gut – noch etwas üben.":"Noch einmal üben lohnt sich.";
  V.innerHTML=`<div class="card" style="text-align:center">${ringSvg(pct)}<h2>${Q.score} von ${Q.qs.length} richtig</h2><p>${msg}</p><p class="muted small">🔥 Trainingsserie: ${streak()} Tag(e)</p></div>
  <button class="btn block" id="again">Neue Runde</button>
  ${Object.keys(S.wrong).length?`<a class="btn sec block" href="#/fehler">Fehlertraining (${Object.keys(S.wrong).length})</a>`:""}
  ${Q.back?`<a class="btn sec block" href="${Q.back}">Zurück</a>`:""}
  <a class="btn sec block" href="#/training">Zum Training</a>`;
  $("#again").onclick=()=>route();
  window.scrollTo(0,0);
}

/* ================= TRAINING-SEITEN ================= */
function training(){
  setTitle("Training",false);stopTimer();
  const nw=Object.keys(S.wrong).length,st=streak();
  V.innerHTML=`<div class="card ring"><span style="font-size:40px">🔥</span><div><b>${st} Tag${st===1?"":"e"} Trainingsserie</b><div class="muted small">Jeden Tag eine Runde – so bleibt das Wissen hängen.</div></div></div>
  <div class="grid">
   <a class="tile wide hl" href="#/tag"><span class="ic">☀️</span><div><b>Tagestraining</b><br><small>15 gemischte Fragen, deine Fehler zuerst</small></div></a>
   <a class="tile" href="#/ihk/d34"><span class="ic">${IHK.d34.ic}</span><b>IHK ${IHK.d34.short}</b><small>Versicherungsvermittlung · ${IHK.d34.qs.length} Fragen</small><div class="bar"><i style="width:${mastery(IHK.d34.qs.map((_,i)=>"d34:"+i))}%"></i></div></a>
   <a class="tile" href="#/ihk/f34"><span class="ic">${IHK.f34.ic}</span><b>IHK ${IHK.f34.short}</b><small>Finanzanlagenvermittlung · ${IHK.f34.qs.length} Fragen</small><div class="bar"><i style="width:${mastery(IHK.f34.qs.map((_,i)=>"f34:"+i))}%"></i></div></a>
   <a class="tile" href="#/rechnen"><span class="ic">🧮</span><b>Rechentrainer</b><small>Unbegrenzt neue Aufgaben${S.calc.n?` · ${Math.round(S.calc.r/S.calc.n*100)} % richtig`:""}</small></a>
   <a class="tile" href="#/fehler"><span class="ic">🩹</span><b>Fehlertraining</b><small>${nw?nw+" Frage"+(nw===1?"":"n")+" offen":"Keine Fehler offen 🎉"}</small></a>
   <a class="tile" href="#/quiz/mix"><span class="ic">🎯</span><b>Mix-Quiz</b><small>10 Fragen aus den Lernthemen</small></a>
