  </div>
  <h3>Themen-Quiz</h3><div class="card" style="padding:0"><div class="list">${TOPICS.map(t=>`<a href="#/quiz/${t.id}"><span>${t.ic}</span>${t.title}<span class="arr">${S.best[t.id]!=null?S.best[t.id]+" %":"›"}</span></a>`).join("")}</div></div>
  <p class="foot">Eigene Übungsfragen nach dem IHK-Rahmenplan – keine offiziellen IHK-Prüfungsfragen.</p>`;
}
function ihk(b,mode,cat){
  const B=IHK[b];if(!B)return training();
  const ids=B.qs.map((_,i)=>b+":"+i);
  if(mode==="cat"){const sub=ids.filter(id=>POOL[id].cat===cat);return startSession({title:B.short+": "+B.cats[cat],qs:shuffle(sub.map(id=>POOL[id])),back:"#/ihk/"+b});}
  if(mode==="mix")return startSession({title:B.short+": Übung",qs:shuffle(ids.map(id=>POOL[id])).slice(0,20),back:"#/ihk/"+b});
  if(mode==="exam"){
    // gleichmäßig über alle Gebiete verteilt
    const per={};ids.forEach(id=>{const c=POOL[id].cat;(per[c]=per[c]||[]).push(id);});
    let pickIds=[];const cats=Object.keys(per),n=Math.min(40,ids.length);
    Object.values(per).forEach(l=>pickIds.push(...shuffle(l).slice(0,Math.floor(n/cats.length))));
    pickIds.push(...shuffle(ids.filter(id=>!pickIds.includes(id))).slice(0,n-pickIds.length));
    if(!confirm(`Prüfungssimulation: ${pickIds.length} Fragen, 60 Minuten. Die Auflösung gibt es erst am Ende. Starten?`))return location.hash="#/ihk/"+b;
    return startSession({title:B.short+" Prüfung",qs:shuffle(pickIds.map(id=>POOL[id])),mode:"exam",minutes:60,bank:b});
  }
  setTitle("IHK "+B.short,true);stopTimer();
  const ex=S.exams.filter(e=>e.b===b);
  V.innerHTML=`<h2>${B.ic} ${B.title}</h2><p class="muted small">${B.info}</p>
  <div class="card ring">${ringSvg(mastery(ids))}<div><b>Lernstand</b><div class="muted small">Anteil der Fragen, die du zuletzt richtig beantwortet hast.</div>${ex.length?`<div class="small">Letzte Simulation: <b>${ex[ex.length-1].p} %</b> · Beste: <b>${Math.max(...ex.map(e=>e.p))} %</b></div>`:""}</div></div>
  <a class="btn block" href="#/ihk/${b}/exam">📝 Prüfungssimulation (60 Min.)</a>
  <a class="btn sec block" href="#/ihk/${b}/mix">🎲 20 Zufallsfragen üben</a>
  <h3>Nach Prüfungsgebiet üben</h3>
  <div class="card" style="padding:0"><div class="list">${Object.entries(B.cats).map(([k,name])=>{const sub=ids.filter(id=>POOL[id].cat===k);const m=mastery(sub);return `<a href="#/ihk/${b}/cat/${k}"><span class="chk ${m===100?"done":""}">${m===100?"✓":m+"%"}</span><span>${name}<br><small class="muted">${sub.length} Fragen</small></span><span class="arr">›</span></a>`;}).join("")}</div></div>
  <p class="foot">Eigene Übungsfragen nach dem IHK-Rahmenplan – keine offiziellen IHK-Prüfungsfragen. Rechtsstand Oktober 2026.</p>`;
}
function fehler(){
  const ids=Object.keys(S.wrong).filter(id=>POOL[id]);
  startSession({title:"Fehlertraining",qs:shuffle(ids.map(id=>POOL[id])).slice(0,20),empty:"Super – du hast gerade keine offenen Fehler! 🎉 Falsch beantwortete Fragen landen automatisch hier und verschwinden, wenn du sie zweimal richtig beantwortest.",back:"#/training"});
}
function tag(){
  const w=shuffle(Object.keys(S.wrong).filter(id=>POOL[id])).slice(0,5).map(id=>POOL[id]);
  const unseen=shuffle(ALLQ.filter(q=>!S.stats[q.id]&&!w.includes(q)));
  const rest=shuffle(ALLQ.filter(q=>!w.includes(q)&&!unseen.includes(q)));
  const qs=w.concat(unseen.slice(0,8)).concat(rest);
  const list=qs.slice(0,13).concat([newCalc(),newCalc()]);
  startSession({title:"Tagestraining",qs:shuffle(list),back:"#/training"});
}
function rechnen(){
  startSession({title:"Rechentrainer",qs:Array.from({length:10},newCalc),back:"#/training"});
}

/* Glossar & Karteikarten */
function gFilter(){
  const f=S.gf||{x:"alle",c:""};
  return GLOSSAR.filter(g=>{const C=GCATS[g[2]];
    if(f.c)return g[2]===f.c;
    if(f.x==="alle")return true;
    return C.x===f.x||C.x==="beide";});
}
function glossar(){
  setTitle("Glossar",false);
  S.gf=S.gf||{x:"alle",c:""};
  const xs=[["alle","Alle"],["34d","§34d"],["34f","§34f"]];
  const catsFor=x=>Object.entries(GCATS).filter(([k,C])=>x==="alle"||C.x===x||C.x==="beide");
  V.innerHTML=`<input id="gs" placeholder="Begriff suchen …" autocomplete="off">
  <div style="margin:10px 0 4px">${xs.map(([k,n])=>`<button class="chip ${S.gf.x===k?"on":""}" data-x="${k}">${n}</button>`).join("")}</div>
  <select id="gc"><option value="">Alle Gebiete</option>${catsFor(S.gf.x).map(([k,C])=>`<option value="${k}" ${S.gf.c===k?"selected":""}>${C.n}</option>`).join("")}</select>
  <a class="btn block" id="gk" href="#/karten" style="margin-top:10px"></a>
  <p class="muted small" id="gn"></p>
  <div id="gl"></div>`;
  const draw=()=>{
    const f=$("#gs").value.toLowerCase().trim();
    const base=gFilter();
    const list=f?GLOSSAR.filter(g=>(g[0]+" "+g[1]).toLowerCase().includes(f)):base;
    const known=base.filter(g=>S.known&&S.known[g[0]]).length;
    $("#gk").textContent=`🃏 ${base.length} Begriffe als Karteikarten üben`;
    $("#gn").textContent=f?`${list.length} Treffer in allen ${GLOSSAR.length} Begriffen`:`${list.length} Begriffe · ${known} davon als gelernt markiert`;
    let html="";
    Object.entries(GCATS).forEach(([k,C])=>{
      const items=list.filter(g=>g[2]===k).sort((a,b)=>a[0].localeCompare(b[0],"de"));
      if(!items.length)return;
      const badge=C.x==="beide"?"§34d · §34f":C.x==="allg"?"Allgemein":"§"+C.x;
      html+=`<h3>${C.n} <span class="chip" style="font-size:11px;padding:3px 8px;vertical-align:middle">${badge}</span></h3><dl class="gl card">`+
        items.map(g=>`<dt>${S.known&&S.known[g[0]]?"✅ ":""}${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join("")+`</dl>`;
    });
    $("#gl").innerHTML=html||"<p class='muted'>Kein Treffer.</p>";
  };
  V.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{S.gf={x:b.dataset.x,c:""};save();glossar();});
  $("#gc").onchange=e=>{S.gf.c=e.target.value;save();draw();};
  $("#gs").oninput=draw;
  draw();
}
let K=null;
function karten(onlyNew){
  setTitle("Karteikarten",true);
  S.known=S.known||{};
  const base=gFilter();
  if(onlyNew===undefined)onlyNew=true;
  let deck=base.filter(g=>!onlyNew||!S.known[g[0]]);
  K={base,deck:shuffle(deck),onlyNew,done:0};
  drawK();
}
function drawK(){
  const f=S.gf||{x:"alle",c:""};
  const label=f.c?GCATS[f.c].n:(f.x==="alle"?"Alle Gebiete":"§"+f.x);
  const known=K.base.filter(g=>S.known[g[0]]).length,pct=Math.round(known/K.base.length*100);
  if(!K.deck.length){
    V.innerHTML=`<div class="card" style="text-align:center">${ringSvg(pct)}<h2>Stapel geschafft! 🎉</h2><p>${label}: ${known} von ${K.base.length} Begriffen gelernt.</p></div>
    <button class="btn block" id="kall">Alle ${K.base.length} Karten nochmal üben</button>
    <a class="btn sec block" href="#/glossar">Anderes Gebiet wählen</a>
    ${known?`<button class="btn sec block" id="kreset">Lernstand für dieses Gebiet zurücksetzen</button>`:""}`;
    $("#kall").onclick=()=>karten(false);
    if($("#kreset"))$("#kreset").onclick=()=>{if(confirm("Gelernt-Markierungen für dieses Gebiet löschen?")){K.base.forEach(g=>delete S.known[g[0]]);save();karten(true);}};
    return;
  }
  const g=K.deck[0],C=GCATS[g[2]];
  V.innerHTML=`<p class="muted small" style="text-align:center;margin:0">${label} · noch ${K.deck.length} Karte${K.deck.length===1?"":"n"} im Stapel</p>
  <div class="bar" style="margin:6px 0"><i style="width:${pct}%"></i></div>
  <p class="muted small" style="text-align:center;margin:0">${known} von ${K.base.length} gelernt · Tippen zum Umdrehen</p>
  <div class="flip" id="fl"><div class="in"><div class="fa"><div>${esc(g[0])}<div style="font-size:12px;font-weight:400;opacity:.8;margin-top:10px">${C.n}</div></div></div><div class="fb">${esc(g[1])}</div></div></div>
  <div class="row"><button class="btn sec" id="kn">↻ Nochmal</button><button class="btn" id="ky" style="background:var(--ok)">✓ Kann ich</button></div>
  <div class="row" style="margin-top:8px"><a class="btn sec" href="#/glossar">Gebiet wählen</a>
  <button class="btn sec" id="kmode">${K.onlyNew?"Alle Karten":"Nur ungelernte"}</button></div>`;
  $("#fl").onclick=()=>$("#fl").classList.toggle("on");
  $("#kn").onclick=()=>{const c=K.deck.shift();const pos=Math.min(K.deck.length,3+Math.floor(Math.random()*4));K.deck.splice(pos,0,c);drawK();};
  $("#ky").onclick=()=>{const c=K.deck.shift();S.known[c[0]]=1;save();markDay();drawK();};
  $("#kmode").onclick=()=>karten(!K.onlyNew);
}

function num(id){const v=parseFloat(String($("#"+id).value).replace(",","."));return isFinite(v)?v:0;}
function field(id,label,val,suf){return `<div><label class="f" for="${id}">${label}${suf?" ("+suf+")":""}</label><input id="${id}" type="number" inputmode="decimal" step="any" value="${val}"></div>`;}
function bindCalc(fn){V.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",fn));fn();}

function lineChart(pts){ // pts: [{y, dep, val}]
  if(pts.length<2)return"";
  const W=320,H=150,P=6,max=Math.max(...pts.map(p=>p.val),1);
  const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v/max)*(H-2*P-14);
  const path=k=>pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(p[k]).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:12px">
  <path d="${path("val")}L${x(pts.length-1)},${H-P}L${P},${H-P}Z" fill="var(--brand2)" opacity=".18"/>
  <path d="${path("val")}" fill="none" stroke="var(--brand2)" stroke-width="2.5"/>
  <path d="${path("dep")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${P}" y="12" font-size="11" fill="var(--muted)">— Vermögen  - - Einzahlungen</text>
  <text x="${W-P}" y="${H-P-4}" font-size="11" text-anchor="end" fill="var(--muted)">${pts[pts.length-1].y} J.</text></svg>`;
}
function simulate(start,monthly,years,ret,cost,dyn){
  const rm=Math.pow(1+(ret-cost)/100,1/12)-1;
  let v=start,dep=start,rate=monthly;const pts=[{y:0,dep,val:v}];
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){v=(v+rate)*(1+rm);dep+=rate;}
    pts.push({y,dep,val:v});rate*=1+dyn/100;
  }
  return {v,dep,pts};
}

avd(){
  V.innerHTML=`<div class="card"><div class="two">

    const years=Math.min(60,Math.max(0,Math.round(num("j")))),ky=Math.max(0,Math.round(num("ky")));

    $("#o").innerHTML=`<div class="big"><small>Staatliche Förderung pro Jahr</small><b>${eur(g+kz)}</b></div>

    ${!ok&&b>0?`<div style="grid-column:1/-1;background:rgba(192,57,43,.12)"><small>Hinweis</small>Unter 120 € im Jahr gibt es keine Zulage.</div>`:""}
    ${b>6840?`<div style="grid-column:1/-1;background:rgba(192,57,43,.12)"><small>Hinweis</small>Höchstens 6.840 € pro Jahr einzahlbar.</div>`:""}
    <div class="big"><small>Geschätztes Depot nach ${years} Jahren</small><b>${eur(v)}</b></div>
    <div><small>Eigene Einzahlungen</small><b>${eur(dep)}</b></div><div><small>Zulagen gesamt</small><b>${eur(zul)}</b></div>`;
    $("#ch").innerHTML=lineChart(pts);

},
luecke(){
  V.innerHTML=`<div class="card"><div class="two">
  ${field("n","Nettoeinkommen heute",2800,"€/Monat")}${field("w","Wunsch im Alter",80,"% vom Netto")}
  ${field("g","Erwartete Renten (netto)",1300,"€/Monat")}${field("j","Jahre bis Rente",32,"")}
  ${field("i","Inflation p. a.",2,"%")}${field("r","Rendite Ansparphase",6,"%")}

    const gap=Math.max(0,num("n")*num("w")/100-num("g")),j=Math.max(0,num("j"));

},
kredit(){
