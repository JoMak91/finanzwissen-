<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltscheck · Finanz-Akademie</title>
<meta name="theme-color" content="#123c69">
<link rel="manifest" href="lernapp.webmanifest">
<link rel="icon" href="lernapp-icon-192.png">
<link rel="apple-touch-icon" href="lernapp-icon-192.png">
<meta name="description" content="Haushaltscheck für Kunden: Einnahmen, Fixkosten, Überschuss und Sparempfehlung – mit PDF">
<style>
/* Haushaltscheck – Modul der Finanz-Akademie, offline-fähig (keine externen Dateien)
   Layout: Beratungsbogen in drei Schritten (Einnahmen → Kosten → Ergebnis) mit fester Ergebnisleiste unten */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E2E7EF; --line:#CBD3DF;
  --fg:#152033; --muted:#5B6678; --accent:#123c69; --accent-ink:#FFFFFF; --head:#123c69; --head-ink:#E8EEF7;
  --brass:#e0a526; --good:#2E7D4F; --warn:#B86E00; --crit:#B3261E; --info:#3D5F8C;
  --good-bg:#E2F1E7; --warn-bg:#FBEBD2; --crit-bg:#F8DEDB; --info-bg:#E1E9F4;
  --c-fix:#5B6C8F; --c-leben:#C98B1E; --c-spar:#2E7D4F; --c-plus:#7FC29B; --c-frei:#C9D3E0; --c-minus:#B3261E;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171E2A; --sunk:#202A39; --line:#2E3A4C;
  --fg:#E5EAF2; --muted:#98A3B5; --accent:#7EA6E0; --accent-ink:#0A1220; --head:#0B111A; --head-ink:#DDE5F1;
  --brass:#D9A548; --good:#5CC48A; --warn:#E6A23C; --crit:#F07167; --info:#86A9DB;
  --good-bg:#173226; --warn-bg:#3A2C12; --crit-bg:#3D1C1A; --info-bg:#1B2840;
  --c-fix:#8396BD; --c-leben:#D9A548; --c-spar:#5CC48A; --c-plus:#2F7A52; --c-frei:#3A475B; --c-minus:#F07167; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E2A; --sunk:#202A39; --line:#2E3A4C;
  --fg:#E5EAF2; --muted:#98A3B5; --accent:#7EA6E0; --accent-ink:#0A1220; --head:#0B111A; --head-ink:#DDE5F1;
  --brass:#D9A548; --good:#5CC48A; --warn:#E6A23C; --crit:#F07167; --info:#86A9DB;
  --good-bg:#173226; --warn-bg:#3A2C12; --crit-bg:#3D1C1A; --info-bg:#1B2840;
  --c-fix:#8396BD; --c-leben:#D9A548; --c-spar:#5CC48A; --c-plus:#2F7A52; --c-frei:#3A475B; --c-minus:#F07167; color-scheme:dark;}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.back{color:inherit;text-decoration:none;font-weight:600;font-size:.9rem;opacity:.85;white-space:nowrap}
.pdfrow{display:flex;gap:8px;flex-wrap:wrap}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{background:var(--head);color:var(--head-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 18px}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:.82rem;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
.btn{font:inherit;font-weight:600;border:1px solid transparent;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.soft{background:var(--sunk);color:var(--fg)}
.btn.danger{background:var(--crit);color:#fff}
.btn.small{padding:6px 12px;min-height:32px;font-size:.85rem}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.step:focus-visible,.chip:focus-visible,.cust:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
section.card{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.12rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:.95rem;margin:0;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:.84rem}
.pos{color:var(--good)} .neg{color:var(--crit)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
textarea{min-height:110px;font-family:var(--f-num);font-size:.8rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{background:var(--info-bg);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner .grow{flex:1 1 220px;min-width:0}
/* Schritte */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.step{font:inherit;border:0;background:transparent;border-radius:9px;padding:8px 4px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.86rem;display:flex;align-items:center;justify-content:center;gap:6px}
.step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--fg);font-size:.72rem}
.step[aria-current="step"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px #0002}
.step[aria-current="step"] b{background:var(--accent);color:var(--accent-ink)}
/* Positionen */
.grp{display:flex;flex-direction:column;gap:2px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1fr) 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item input,.item select{min-height:38px;padding:7px 9px}
.item .amt{text-align:right}
@media (max-width:520px){.item{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px}.item .lbl{grid-column:1/-1}}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px;border-radius:8px}
.x:hover{background:var(--sunk);color:var(--crit)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:.8rem;border:1px dashed var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.gsum{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.9rem}
details.more summary{cursor:pointer;color:var(--muted);font-size:.84rem;margin-top:8px}
/* Ergebnis */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1;letter-spacing:-.02em}
.stackbar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--sunk);margin:12px 0 8px}
.stackbar span{height:100%;min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;font-size:.84rem}
.legend div{display:flex;justify-content:space-between;gap:8px;min-width:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;flex:none}
.reco{border-radius:var(--r);padding:16px;background:var(--good-bg);display:flex;flex-direction:column;gap:6px}
.reco.warn{background:var(--warn-bg)} .reco.crit{background:var(--crit-bg)}
.reco .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.reco .val{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1.1}
.ratio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ratio:last-child{border-bottom:0}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.6}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.info{background:var(--info-bg);color:var(--info)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:140px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.points{display:flex;flex-direction:column;gap:8px}
.point{display:grid;grid-template-columns:6px minmax(0,1fr);gap:10px;background:var(--bg);border-radius:10px;padding:10px 10px 10px 0;overflow:hidden}
.point .stripe{border-radius:0 4px 4px 0}
.point.crit .stripe{background:var(--crit)} .point.warn .stripe{background:var(--warn)} .point.info .stripe{background:var(--info)}
.point p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
input[type=range]{padding:0;min-height:28px;border:0;background:transparent;accent-color:var(--accent)}
/* Kundenliste */
.custs{display:flex;flex-direction:column}
.cust{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.cust:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;color:var(--accent)}
.cust .n{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .s{display:block;font-size:.8rem;color:var(--muted)}
/* Ergebnisleiste */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);color:var(--head-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:center}
.dock .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;opacity:.7}
.dock .v{font-family:var(--f-num);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .v.neg{color:#FF9C93} .dock .v.pos{color:#8EE0AE}
@media (max-width:420px){.dock-in{grid-template-columns:repeat(3,minmax(0,1fr))}.dock .btn{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.scrim{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.summary{white-space:pre-wrap;font-family:var(--f-num);font-size:.78rem;background:var(--bg);border-radius:10px;padding:12px;max-height:50vh;overflow:auto}
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="5" width="28" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><path d="M8 22 L14 15 L19 19 L26 10" fill="none" stroke="#D9A548" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="min-width:0"><h1>Haushaltscheck</h1><div class="sub" id="hSub">Fixkosten, Überschuss und Sparrate</div></div>
  </div>
  <a class="back" id="hBack" href="lernapp.html">‹ Finanz-Akademie</a><button class="btn ghost small" type="button" id="hBtn">‹ Alle Kunden</button>
</div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dock-in">
  <div><div class="l">Netto</div><div class="v" id="dIn">–</div></div>
  <div><div class="l">Ausgaben</div><div class="v" id="dOut">–</div></div>
  <div><div class="l">Frei</div><div class="v" id="dFree">–</div></div>
  <button class="btn small" type="button" id="dGo">Ergebnis</button>
</div></div>
<input type="file" id="backupIn" accept=".json,application/json" hidden>

<script>
const IV = {m:{l:'monatlich',f:1}, q:{l:'vierteljährl.',f:1/3}, h:{l:'halbjährl.',f:1/6}, j:{l:'jährlich',f:1/12}};
const KINDERGELD = 259; // € pro Kind und Monat (2026)
const GROUPS = [
  {id:'wohnen', name:'Wohnen & Energie', need:true, presets:['Miete / Kreditrate Haus','Nebenkosten / Hausgeld','Strom','Gas / Heizung','Wasser / Abwasser','Grundsteuer','Müllabfuhr',['Rundfunkbeitrag',18.36]]},
  {id:'versicherung', name:'Versicherungen', need:true, presets:['Privathaftpflicht','Hausrat','Wohngebäude','KFZ-Versicherung','Berufsunfähigkeit','Risikolebensversicherung','Rechtsschutz','Unfallversicherung','Krankenzusatz','Pflegezusatz','Zahnzusatz']},
  {id:'mobil', name:'Mobilität', need:true, presets:['Autokredit / Leasing','Tanken / Laden','KFZ-Steuer','Wartung & TÜV (Rücklage)',['Deutschlandticket',63]]},
  {id:'komm', name:'Handy, Internet & Abos', need:false, presets:['Handyvertrag','Internet / Festnetz','Streaming (Netflix, Disney+ …)','Musik (Spotify …)','Fitnessstudio','Zeitung / Apps','Cloud-Speicher']},
  {id:'kinder', name:'Kinder', need:true, presets:['Kita / Betreuung','Verein / Musikschule','Taschengeld','Schulbedarf (Rücklage)']},
  {id:'kredite', name:'Kredite & Raten', need:true, presets:['Ratenkredit','Dispo / Kreditkarte','0-%-Finanzierung','Privatdarlehen']},
  {id:'leben', name:'Lebenshaltung (variabel)', need:null, presets:['Lebensmittel & Drogerie','Kleidung','Freizeit & Ausgehen','Urlaub (Rücklage)','Geschenke','Haustier','Sonstiges']},
  {id:'sparen', name:'Bestehendes Sparen & Vorsorge', need:false, saving:true, presets:['ETF-Sparplan','Tagesgeld-Sparrate','Bausparvertrag','Riester / Rürup','Private Rentenversicherung','Betriebliche Altersvorsorge (Eigenanteil netto)','Kinder-Sparplan']},
];
const G = Object.fromEntries(GROUPS.map(g=>[g.id,g]));
const INC_PRESETS = ['Nettogehalt Person 1','Nettogehalt Person 2','Kindergeld','Elterngeld','Minijob / Nebenjob','Weihnachts-/Urlaubsgeld (netto)','Mieteinnahmen','Unterhalt','Sonstige Einnahmen'];
const WANTS_IN_LEBEN = ['kleidung','freizeit','urlaub','geschenke','sonstiges','haustier'];

const KEY='haushaltscheck_v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
let S = load(), cur=null, step=1, toastT=null, listQ='';
function load(){
  try{ const r=localStorage.getItem(KEY); if(r){ const d=JSON.parse(r); if(Array.isArray(d.customers)) return d; } }catch(e){}
  return {customers:[sampleCustomer()]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Speichern im Browser nicht möglich.'); } }
function sampleCustomer(){
  const it=(group,label,amount,iv='m',provider='')=>({id:uid(),group,label,amount,iv,provider,note:''});
  return {id:uid(), sample:true, name:'Familie Beispiel', adults:2, kids:2, reserve:4000, rate:10, created:new Date().toISOString().slice(0,10), note:'',
    income:[{id:uid(),label:'Nettogehalt Person 1',amount:2950,iv:'m'},{id:uid(),label:'Nettogehalt Person 2',amount:650,iv:'m'},{id:uid(),label:'Kindergeld',amount:2*KINDERGELD,iv:'m'},{id:uid(),label:'Weihnachts-/Urlaubsgeld (netto)',amount:1800,iv:'j'}],
    costs:[ it('wohnen','Miete / Kreditrate Haus',1150), it('wohnen','Nebenkosten / Hausgeld',180), it('wohnen','Strom',95), it('wohnen','Gas / Heizung',130), it('wohnen','Rundfunkbeitrag',55.08,'q'), it('wohnen','Grundsteuer',320,'j'),
      it('versicherung','Privathaftpflicht',78,'j'), it('versicherung','Hausrat',11.2), it('versicherung','KFZ-Versicherung',780,'j'), it('versicherung','Rechtsschutz',29.9),
      it('mobil','Tanken / Laden',220), it('mobil','KFZ-Steuer',190,'j'), it('mobil','Wartung & TÜV (Rücklage)',40), it('mobil','Autokredit / Leasing',289),
      it('komm','Handyvertrag',49.98), it('komm','Internet / Festnetz',44.95), it('komm','Streaming (Netflix, Disney+ …)',35.97), it('komm','Fitnessstudio',29.9),
      it('kinder','Kita / Betreuung',160),
      it('kredite','Ratenkredit',145),
      it('leben','Lebensmittel & Drogerie',800), it('leben','Kleidung',150), it('leben','Freizeit & Ausgehen',200), it('leben','Geschenke',40),
      it('sparen','ETF-Sparplan',100) ]};
}

/* ---------- Rechnen ---------- */
const mo = x => (+x.amount||0) * (IV[x.iv]?.f ?? 1);
function calc(c){
  const net = c.income.reduce((s,x)=>s+mo(x),0);
  const byG = {}; GROUPS.forEach(g=>byG[g.id]=0); c.costs.forEach(x=>{ byG[x.group]=(byG[x.group]||0)+mo(x); });
  const fix = GROUPS.filter(g=>!g.saving && g.id!=='leben').reduce((s,g)=>s+byG[g.id],0);
  const leben = byG.leben, saved = byG.sparen;
  const spend = fix + leben;
  const free = net - spend - saved;
  const target = net * (c.rate||10)/100;
  const gap = Math.max(0, target - saved);
  const extra = Math.max(0, Math.min(gap, free));
  let wants = byG.komm; let lebenNeed=0;
  c.costs.filter(x=>x.group==='leben').forEach(x=>{ const l=x.label.toLowerCase(); if(WANTS_IN_LEBEN.some(w=>l.includes(w))) wants+=mo(x); else lebenNeed+=mo(x); });
  const needs = GROUPS.filter(g=>g.need===true).reduce((s,g)=>s+byG[g.id],0) + lebenNeed;
  return {net, byG, fix, leben, saved, spend, free, target, gap, extra, after: free-extra, needs, wants, rateNow: net>0? saved/net:0, rateAfter: net>0?(saved+extra)/net:0, reserveGoal:[spend*3, spend*6]};
}
function points(c, r){
  const P=[]; const has=(g,rx)=>c.costs.some(x=>x.group===g && rx.test(x.label.toLowerCase()) && +x.amount>0);
  if(r.net<=0) return [{sev:'info',t:'Noch keine Einnahmen erfasst',p:'Trage zuerst die Netto-Einnahmen ein.'}];
  if(r.free<0) P.push({sev:'crit',t:'Ausgaben übersteigen die Einnahmen',p:`Monatlich fehlen ${eur0(-r.free)}. Zuerst Kosten senken, bevor neue Sparverträge sinnvoll sind.`});
  if(r.fix/r.net>0.6) P.push({sev:'warn',t:`Fixkostenquote ${pct(r.fix/r.net)}`,p:'Über 60 % der Einnahmen sind fest gebunden. Wenig Spielraum bei unerwarteten Ausgaben.'});
  if(r.byG.wohnen/r.net>0.4) P.push({sev:'warn',t:`Wohnkosten ${pct(r.byG.wohnen/r.net)} vom Netto`,p:'Als gesund gelten bis etwa 35–40 % inklusive Energie.'});
  if(r.byG.kredite>0) P.push({sev: r.byG.kredite/r.net>0.15?'crit':'warn', t:`Konsumkredite: ${eur0(r.byG.kredite)} pro Monat`, p:'Zinsen und Laufzeiten prüfen. Eine Umschuldung oder Sondertilgung schafft oft schnell Luft.'});
  if(has('kredite',/dispo|kreditkarte/)) P.push({sev:'crit',t:'Dispo oder Kreditkarte im Minus',p:'Die teuerste Form von Schulden. Ablösen hat Vorrang vor dem Sparen.'});
  const res = +c.reserve||0;
  if(res < r.reserveGoal[0]) P.push({sev:'warn',t:'Notgroschen zu klein',p:`Vorhanden ${eur0(res)}, empfohlen sind 3 Monatsausgaben, also ${eur0(r.reserveGoal[0])}. Die Sparrate sollte zuerst den Notgroschen auffüllen.`});
  if(!has('versicherung',/haftpflicht/)) P.push({sev:'warn',t:'Keine Privathaftpflicht erfasst',p:'Wichtigste Versicherung für jeden Haushalt – kostet meist unter 10 € im Monat.'});
  if(!has('versicherung',/berufsunf|\bbu\b/) && c.income.some(x=>/gehalt|lohn/i.test(x.label))) P.push({sev:'info',t:'Keine Berufsunfähigkeitsabsicherung erfasst',p:'Die Arbeitskraft ist bei Familien meist der größte Vermögenswert. Bestehenden Schutz erfragen.'});
  if(c.kids>0 && !has('versicherung',/risikoleb|lebensvers/)) P.push({sev:'info',t:'Keine Risikolebensversicherung erfasst',p:'Mit Kindern oder Hauskredit sichert sie die Familie ab, falls ein Einkommen wegfällt.'});
  if(r.byG.komm/r.net>0.06) P.push({sev:'info',t:'Abos und Verträge vergleichsweise hoch',p:`${eur0(r.byG.komm)} pro Monat für Handy, Internet und Abos. Tarife und ungenutzte Abos prüfen.`});
  const insMonthly = c.costs.filter(x=>x.group==='versicherung' && x.iv==='m').length;
  if(insMonthly>=3) P.push({sev:'info',t:'Versicherungen monatlich bezahlt',p:`${insMonthly} Verträge laufen monatlich. Jährliche Zahlweise spart oft 3–8 % Ratenzuschlag.`});
  if(r.rateNow>=(c.rate||10)/100 && r.free>=0) P.push({sev:'info',t:'Sparziel bereits erreicht',p:`Es werden schon ${pct(r.rateNow)} gespart. Der freie Betrag kann für Ziele wie Altersvorsorge oder Kinder genutzt werden.`});
  const o={crit:0,warn:1,info:2}; return P.sort((a,b)=>o[a.sev]-o[b.sev]);
}

  <div class="actions"><button class="btn soft" type="button" data-step="2">Zurück</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn soft" type="button" data-act="dup">Als Kopie anlegen</button><button class="btn soft" type="button" data-act="summary">Zusammenfassung kopieren</button></span></div>

function summaryText(c){
  const r=calc(c); const rate=c.rate||10; const L=[];
  L.push(`Haushaltscheck – ${c.name} (${new Date().toLocaleDateString('de-DE')})`);
  L.push(`Haushalt: ${c.adults} Erwachsene${c.kids?`, ${c.kids} Kinder`:''}`,'');
  L.push(`Netto-Einnahmen:        ${eur(r.net)}`);
  GROUPS.forEach(g=>{ if(r.byG[g.id]>0) L.push(`${(g.name+':').padEnd(24)}${eur(r.byG[g.id])}`); });
  L.push('',`Frei pro Monat:         ${eur(r.free)}`);
  L.push(`Sparquote heute:        ${pct(r.rateNow)}`);
  if(r.free<0) L.push(`→ Fehlbetrag ${eur(-r.free)} pro Monat. Erst Kosten senken.`);
  else if(r.gap<=0) L.push(`→ Sparziel ${rate} % erreicht.`);
  else L.push(`→ Empfohlene zusätzliche Sparrate: ${eur(Math.min(r.gap,r.free))} pro Monat (Ziel ${rate} % = ${eur(r.target)})`);
  L.push(`Notgroschen: ${eur0(+c.reserve||0)} vorhanden, Ziel ${eur0(r.reserveGoal[0])}–${eur0(r.reserveGoal[1])}`);
  const P=points(c,r); if(P.length){ L.push('','Gesprächspunkte:'); P.forEach(p=>L.push('• '+p.t)); }
  return L.join('\n');
}

function pdfNorm(s){return String(s).replace(/[   ]/g,' ');}
function pdfW(s,size,bold){let w=0;for(const ch of pdfNorm(s)){const c=ch.charCodeAt(0);

function pdfEsc(s){let o='';for(const ch of pdfNorm(s)){const c=ch.charCodeAt(0);
  if(ch==='\\'||ch==='('||ch===')')o+='\\'+ch;else if(c>=32&&c<=126)o+=ch;
  else if(PDFX[ch])o+='\\'+PDFX[ch][0].toString(8).padStart(3,'0');else o+='?';}return o;}
function pdfWrap(s,size,bold,maxW){const words=pdfNorm(s).split(' ');const lines=[];let cur='';

function hexRGB(h){h=h.replace('#','');return[0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');}

function PdfDoc(){
  const W=595.28,H=841.89,pages=[];let c=null;

    rect(x,y,w,h,hex){c.push('q '+hexRGB(hex)+' rg '+[x,H-y-h,w,h].map(v=>v.toFixed(2)).join(' ')+' re f Q');return api;},
    line(x1,y1,x2,y2,hex,lw){c.push('q '+hexRGB(hex||'#D9DFE3')+' RG '+(lw||0.6)+' w '+x1.toFixed(2)+' '+(H-y1).toFixed(2)+' m '+x2.toFixed(2)+' '+(H-y2).toFixed(2)+' l S Q');return api;},
    text(x,y,s,o){o=o||{};const size=o.size||10,bold=!!o.bold;let tx=x;
      if(o.align==='right')tx=x-pdfW(s,size,bold);else if(o.align==='center')tx=x-pdfW(s,size,bold)/2;
      c.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+hexRGB(o.color||'#16263A')+' rg '+tx.toFixed(2)+' '+(H-y).toFixed(2)+' Td ('+pdfEsc(s)+') Tj ET');return api;},
    build(){

      const cat=add(''),pg=add(''),f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids=[];

        kids.push(add('<< /Type /Page /Parent '+pg+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+cs+' 0 R >>'));});
      objs[cat-1]='<< /Type /Catalog /Pages '+pg+' 0 R >>';
      objs[pg-1]='<< /Type /Pages /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] /Count '+kids.length+' >>';
      let out='%PDF-1.4\n%âãÏÓ\n';const off=[];
      objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
      const x=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
      out+='trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+x+'\n%%EOF';

}

function recoPlain(c,r){
  const rate=c.rate||10;
  if(r.net<=0) return ['Empfehlung','–','Noch keine Einnahmen erfasst.'];
  if(r.free<0) return ['Fehlbetrag',eur0(-r.free)+' / Monat','Pro Monat wird mehr ausgegeben als eingenommen. Zuerst die Kosten um mindestens diesen Betrag senken, danach '+eur0(r.gap)+' für die '+rate+'-%-Sparquote einplanen.'];
  if(r.gap<=0) return ['Sparziel '+rate+' %','erreicht','Es werden bereits '+eur0(r.saved)+' pro Monat ('+pct(r.rateNow)+') gespart. Zusätzlich frei: '+eur0(r.free)+' pro Monat.'];
  if(r.free>=r.gap) return ['Empfohlene zusätzliche Sparrate',eur0(r.gap)+' / Monat','Damit werden '+rate+' % vom Netto gespart ('+eur0(r.target)+' insgesamt'+(r.saved>0?', davon '+eur0(r.saved)+' schon vorhanden':'')+'). Danach bleiben noch '+eur0(r.after)+' pro Monat frei.'];
  return ['Mögliche Sparrate',eur0(r.free)+' / Monat','Für '+rate+' % ('+eur0(r.target)+') fehlen noch '+eur0(r.gap-r.free)+'. Die Sparquote läge damit bei '+pct(r.rateAfter)+'.'];
}

    ensure(gr.length*20+10);
    const mx=Math.max(...gr.map(g=>r.byG[g.id])); const LX=M+170, RW=CW-170-70;
    gr.forEach(g=>{ const v=r.byG[g.id]; doc.text(M,y,g.name,{size:9}); doc.rect(LX,y-9,Math.max(1,v/mx*RW),11,g.saving?COL.spar:g.id==='leben'?COL.leben:COL.fix); doc.text(doc.W-M,y,eur0(v),{size:9,bold:true,align:'right'}); y+=20; });
    y+=4;
  }

  /* Tabellen */
  const cols=[['Position',M,'l'],['Zahlweise',M+300,'r'],['Betrag',M+395,'r'],['pro Monat',doc.W-M,'r']];
  const thead=()=>{doc.rect(M,y-11,CW,17,SOFT);cols.forEach(([t,x,a])=>doc.text(a==='l'?x+4:x-4,y,t,{size:8.5,bold:true,color:MUT,align:a==='l'?undefined:'right'}));y+=17;};
  const trow=(label,iv,amt,m,opt)=>{ opt=opt||{}; const lines=pdfWrap(label||'–',9,opt.bold,280); const h=lines.length*11+5; if(y+h>doc.H-60){newPage(false);thead();}
    if(opt.fill) doc.rect(M,y-11,CW,h+1,opt.fill);
    lines.forEach((l,i)=>doc.text(M+4,y+i*11,l,{size:9,bold:opt.bold,color:opt.color||INK}));
    if(iv!=null) doc.text(M+296,y,iv,{size:9,align:'right',color:MUT});
    if(amt!=null) doc.text(M+391,y,amt,{size:9,align:'right'});
    if(m!=null) doc.text(doc.W-M-4,y,m,{size:9,bold:true,align:'right',color:opt.color||INK});
    y+=h-5; doc.line(M,y,doc.W-M,y,LINE,0.4); y+=12; };
  h2('Einnahmen (netto)');
  ensure(40); thead();
  c.income.filter(x=>+x.amount).forEach(x=>trow(x.label,IV[x.iv].l,eur(+x.amount),eur(mo(x))));
  trow('Summe Einnahmen',null,null,eur(r.net),{bold:true,fill:'#E2F1E7'});
  y+=8;
  h2('Ausgaben und Sparen im Detail');
  ensure(40); thead();
  GROUPS.forEach(g=>{ const items=c.costs.filter(x=>x.group===g.id && +x.amount); if(!items.length) return;
    trow(g.name,null,null,eur(r.byG[g.id]),{bold:true,fill:SOFT,color:NAVY});
    items.forEach(x=>trow(x.label,IV[x.iv].l,eur(+x.amount),eur(mo(x)))); });
  trow('Summe Ausgaben inkl. Sparen',null,null,eur(r.spend+r.saved),{bold:true,fill:'#FBEFE3'});
  trow('Frei pro Monat',null,null,eur(r.free),{bold:true,fill:r.free<0?'#F8DEDB':'#E2F1E7',color:r.free<0?COL.minus:INK});
  y+=8;

  /* Gesprächspunkte */
  const P=points(c,r);
  if(P.length){ h2('Gesprächspunkte'); P.forEach(p=>{ ensure(30); doc.rect(M,y-9,4,4+11*pdfWrap(p.p,9,false,CW-14).length+3,p.sev==='crit'?COL.minus:p.sev==='warn'?'#B86E00':'#3D5F8C'); doc.text(M+12,y,p.t,{size:10,bold:true}); y+=13; pdfWrap(p.p,9,false,CW-14).forEach(l=>{ensure(12);doc.text(M+12,y,l,{size:9,color:MUT});y+=11;}); y+=7; }); }
  if(c.note){ y+=4; para('Notiz: '+c.note,9,MUT); }
  footer();
  return doc.build();
}
function pdfFileName(c){ return 'Haushaltscheck_'+c.name.replace(/[^\wäöüÄÖÜß-]+/g,'_').replace(/^_+|_+$/g,'')+'_'+new Date().toISOString().slice(0,10)+'.pdf'; }
function pdfMsg(t){ const el=document.getElementById('pdfMsg'); if(el){ el.textContent=t; el.hidden=false; } }
function pdfSave(c){
  try{ const blob=buildPdf(c), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=pdfFileName(c); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000); pdfMsg('PDF gespeichert: '+a.download+' (Ordner „Downloads“)'); }
  catch(e){ pdfMsg('Speichern hat nicht geklappt. Nutze „Teilen“ oder im Browser-Menü „Drucken → Als PDF speichern“.'); }
}
async function pdfShare(c){
  try{ const f=new File([buildPdf(c)],pdfFileName(c),{type:'application/pdf'}); await navigator.share({files:[f],title:'Haushaltscheck – '+c.name}); }
  catch(e){ if(e && e.name!=='AbortError') pdfSave(c); }
}

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("lernapp-sw.js").catch(()=>{}));}
</script>
